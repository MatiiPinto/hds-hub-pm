<script>
'use strict';
/* ═══ Autorización Sanitaria NHDS · app única (SPEC-AS-unaApp.md) ═══════════════════════════════════════════════
   Datos: window.ASD (paquete liviano) · window.ASR (propuesta Catymey, solo referentes, se carga al abrir Asignar).
   Backend: Apps Script v4 (token por código al correo). Mismas claves que la 39: rec|recinto|ámbito · svc|servicio|ámbito.
   Modo demostración: ?demo=1 (backend simulado en este navegador; código 123456). */
const URLC='https://script.google.com/macros/s/AKfycbzOkdj1TkaZG7BS6NdVDx8hUKLShOqxZTI37YpCPeGRRZPGLqlqECwnhf8MhYeLNxWW-w/exec', REF_SRC='data/as_app/ref.38613aa0.js', VER='b170b164';
const DEMO=/[?&]demo=1/.test(location.search);
const D=window.ASD, Q=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nrm=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('⚠ Sin espacio en este navegador');return false}}};
const P=DEMO?'asdemo_':'asapp_';

/* ── índices ──────────────────────────────────────────────────────────── */

  imagenologia:'Radiaciones',medicina_nuclear:'Medicina nuclear',quimioterapia:'Quimioterapia',farmacia:'Farmacia',
  hospitalizacion_psiquiatrica:'Hosp. psiquiátrica',al:'Alimentación',re:'REAS',cp:'Calderas y autoclaves',dr:'Droguería',cz:'Central de mezclas'};

function svcCanon(n){
  const k=nrm(n), a=(D.alias||{})[String(n||'').toUpperCase()]||(D.alias||{})[k];
  if(a&&SVC[a])return a;
  const ex=D.servicios.find(x=>nrm(x.n)===k); return ex?ex.n:String(n||'');

  if(!SES)return false; if(esRef())return true;

}

/* ── estados (local + backend) ───────────────────────────────────────── */
let EST=LS.get(P+'est',{}), COLA=LS.get(P+'cola',[]);
const guardaLocal=()=>{LS.set(P+'est',EST);LS.set(P+'cola',COLA);};
function borrada(k){const e=EST[k];if(e&&e.datos&&e.datos._borrada)return true;const v=EST['val|'+k];return !!(v&&v.datos&&v.datos.v==='no');}
function pautasRec(rid){
  const s=new Set((D.asign[rid]||[]).filter(a=>!borrada('rec|'+rid+'|'+a)));
  Object.keys(EST).forEach(k=>{if(k.startsWith('rec|'+rid+'|')&&!borrada(k))s.add(k.split('|')[2]);});
  return [...s].filter(a=>AMB[a]);
}
function pautasSvc(svc){
  const s=new Set(((D.asign_svc||{})[svc]||[]).filter(a=>!borrada('svc|'+svc+'|'+a)));
  Object.keys(EST).forEach(k=>{if(k.startsWith('svc|'+svc+'|')&&!borrada(k))s.add(k.split('|')[2]);});
  return [...s].filter(a=>AMB[a]);
}
const respondidos=d=>Object.keys(d||{}).filter(k=>/^r\d+$/.test(k)&&d[k]).length;
function avanceDe(clave){const e=EST[clave];return e&&e.avance?Number(e.avance):0;}
function avanceSvc(svc){
  const ks=pautasSvc(svc).map(a=>'svc|'+svc+'|'+a);
  (RECS[svc]||[]).forEach(rid=>pautasRec(rid).forEach(a=>ks.push('rec|'+rid+'|'+a)));
  if(!ks.length)return {n:0,p:0,listas:0};
  const sum=ks.reduce((t,k)=>t+avanceDe(k),0);
  return {n:ks.length,p:Math.round(sum/ks.length),listas:ks.filter(k=>avanceDe(k)>=100).length};
}
function avanceRec(rid){const ps=pautasRec(rid);if(!ps.length)return null;return Math.round(ps.reduce((t,a)=>t+avanceDe('rec|'+rid+'|'+a),0)/ps.length);}

/* ── backend ─────────────────────────────────────────────────────────── */
async function api(cuerpo){
  if(DEMO)return demo.post(cuerpo);
  const r=await fetch(URLC,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(cuerpo)});
  return r.json();
}
async function apiGet(params){
  if(DEMO)return demo.get(params);
  const r=await fetch(URLC+'?'+new URLSearchParams(params));
  return r.json();
}
function setSync(c){$('sync').className='sync '+(c||'');}
function sesionVencida(){toast('Tu sesión venció: vuelve a entrar. Lo marcado queda guardado.');SES=null;LS.set(P+'ses',null);setTimeout(()=>ir('#/'),1200);}
async function bajarEstados(){
  if(!SES)return;
  try{
    const r=await apiGet({token:SES.token});
    if(r.ok===false){if(r.error==='sesion')sesionVencida();setSync('err');return;}
    Object.entries(r.estados||{}).forEach(([k,v])=>{
      if(k.startsWith('__'))return;
      if(k.startsWith('svc|')){const p=k.split('|'),c=svcCanon(p[1]);if(c&&c!==p[1]){k='svc|'+c+'|'+p.slice(2).join('|');v={...v,servicio:c};}}
      if(k.startsWith('rec|')){const p=k.split('|'),nid=(D.ridmap||{})[p[1]];if(nid&&nid!==p[1]){k=['rec',nid].concat(p.slice(2)).join('|');v={...v,recinto:nid};}}
      const loc=EST[k];
      if(!loc||new Date(v.ts)>=new Date(loc.ts||0)){if(!COLA.some(c=>c.clave===k))EST[k]=v;}
    });
    guardaLocal();setSync(COLA.length?'pend':'');
  }catch(e){setSync('off');}
}
let vaciando=false;
async function vaciarCola(){
  if(vaciando||!SES)return; if(!COLA.length){setSync('');return;}
  vaciando=true;
  while(COLA.length){
    const it=COLA[0];
    try{
      const r=await api({...it,token:SES.token});
      if(r&&r.ok===false){
        if(r.error==='sesion'){vaciando=false;sesionVencida();return;}
        it._int=(it._int||0)+1;
        if(it._int>=3){COLA.shift();LS.set(P+'fallidos',[...LS.get(P+'fallidos',[]),{...it,error:r.error}]);toast('⚠ No se pudo guardar: '+(r.error||'error del servidor'));}
        guardaLocal();setSync('err');break;
      }
      COLA.shift();guardaLocal();
    }catch(e){setSync('off');break;}
  }
  vaciando=false; if(!COLA.length)setSync(''); else setSync('pend');
  vaciarAdjuntos();
}
setInterval(vaciarCola,15000);addEventListener('online',vaciarCola);
function encolar(clave,servicio,recinto,pauta,datos,avance){
  EST[clave]={servicio,recinto,pauta,datos,avance,usuario:SES.nombre,mio:true,ts:new Date().toISOString()};
  COLA=COLA.filter(c=>c.clave!==clave);
  COLA.push({accion:'estado',clave,servicio,recinto,pauta,datos,avance});
  guardaLocal();setSync('pend');clearTimeout(encolar._t);encolar._t=setTimeout(vaciarCola,700);
}

/* ── adjuntos: cola en IndexedDB (los archivos no caben en localStorage) ─ */
const IDB={db:null,async abrir(){if(this.db)return this.db;return this.db=await new Promise((ok,ko)=>{const q=indexedDB.open(P+'adj',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('pend',{keyPath:'k'});q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error);});},
  async tx(modo,fn){const db=await this.abrir();return new Promise((ok,ko)=>{const t=db.transaction('pend',modo);const r=fn(t.objectStore('pend'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error);});},
  put(v){return this.tx('readwrite',s=>s.put(v));},del(k){return this.tx('readwrite',s=>s.delete(k));},
  async todos(){const db=await this.abrir();return new Promise(ok=>{const q=db.transaction('pend').objectStore('pend').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ok([]);});}};
let subiendo=false;
async function vaciarAdjuntos(){
  if(subiendo||!SES||!navigator.onLine)return; subiendo=true;
  try{
    for(const a of await IDB.todos()){
      const r=await api({accion:'adjunto',token:SES.token,servicio:a.servicio,recinto:a.recNom,clave:a.clave,req:a.req,nombre:a.nombre,mime:a.mime,b64:a.b64});
      if(r&&r.ok){
        const e=EST[a.clave]; const datos={...((e&&e.datos)||{})}; const adj={...(datos._adj||{})};
        const lista=(adj[a.slot]||[]).filter(x=>x.k!==a.k); lista.push({id:r.id,n:r.nombre,kb:r.kb,m:r.mime});
        adj[a.slot]=lista; datos._adj=adj;
        encolar(a.clave,a.servicio,a.recinto,a.pauta,datos,e?e.avance:0);
        await IDB.del(a.k);
        if(RUTA.startsWith('#/p/')){const f=document.activeElement;if(f&&f.tagName==='TEXTAREA')f.blur();render();}   // blur guarda la observación a medio escribir
      }else if(r&&r.error==='sesion'){sesionVencida();break;}
      else{toast('⚠ '+(r&&r.error||'No se pudo subir '+a.nombre));await IDB.del(a.k);}
    }
  }catch(e){} subiendo=false;
}

async function pedirCodigo(){
  const c=$('inCorreo').value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(c)){$('msg').textContent='Escribe tu correo institucional.';return;}
  $('bCod').disabled=true;$('msg').textContent='';
  try{
    const r=await api({accion:'pedir_codigo',correo:c});
    if(!r.ok){$('msg').textContent=r.error||'No se pudo enviar el código.';$('bCod').disabled=false;return;}
    LS.set(P+'correo',c);$('dest').textContent='Revisa tu correo '+c+' e ingresa el código.';
    $('pasoCorreo').hidden=true;$('pasoCod').hidden=false;$('inCod').focus();
  }catch(e){$('msg').textContent='Sin señal con el servidor. Intenta de nuevo.';}
  $('bCod').disabled=false;
}
async function validarCodigo(){
  const c=LS.get(P+'correo',''), cod=$('inCod').value.replace(/\D/g,'');
  if(cod.length!==6)return; $('bEntrar').disabled=true;
  try{
    const r=await api({accion:'validar_codigo',correo:c,codigo:cod});
    if(!r.ok){$('msg').textContent=r.error||'Código incorrecto.';$('bEntrar').disabled=false;$('inCod').value='';return;}
    SES={token:r.token,correo:r.correo,nombre:r.nombre,nivel:r.nivel,servicios:r.servicios||[],expira:r.expira};
    LS.set(P+'ses',SES); setSync('pend'); await bajarEstados(); vaciarCola();

    ir(rr?'#/r/'+encodeURIComponent(rr):s?'#/s/'+encodeURIComponent(svcCanon(s)):'#/');
  }catch(e){$('msg').textContent='Sin señal con el servidor. Intenta de nuevo.';$('bEntrar').disabled=false;}
}

function pintaPlano(rid){

/* ── pauta: el cotejo ────────────────────────────────────────────────── */
let FILTRO='todos', PA=null;
function ctxDe(clave){
  const [tipo,id,amb]=clave.split('|');
  if(tipo==='svc')return {clave,tipo,svc:id,rid:'',amb,lugar:NIVELES[id]||id,recNom:''};
  return {clave,tipo,svc:svcDeRec(id),rid:id,amb,lugar:nomRec(id),recNom:(PTO[id]?PTO[id].n:(REC[id]?REC[id][1]+' '+REC[id][2]:id)).replace(/[\\/:*?"<>|]+/g,'-')};
}
function vPauta(clave){
  PA=ctxDe(clave); const a=AMB[PA.amb];
  if(!a){titulo('Pauta no encontrada');$('app').innerHTML='<div class="vacio">Esta pauta ya no existe en las normas vigentes.</div>';return;}
  if(!puedo(PA.svc))return sinAcceso();
  titulo(nomAmb(PA.amb),PA.lugar+' · '+normaAmb(PA.amb));
  const e=EST[clave]||{}, d=e.datos||{}, reqs=a[4], grupos=a[3];
  const resp=respondidos(d), total=reqs.length, nc=reqs.filter(r=>d['r'+r[0]]==='NC').length;
  const ver=r=>FILTRO==='todos'||(FILTRO==='pend'&&!d['r'+r[0]])||(FILTRO==='nc'&&d['r'+r[0]]==='NC');
  let gPrev=-2, html='';
  reqs.filter(ver).forEach(r=>{
    if(r[2]!==gPrev&&r[2]>=0)html+=`<div class="grupo">${esc(grupos[r[2]])}</div>`; gPrev=r[2];
    const v=d['r'+r[0]]||'', o=d['obs_r'+r[0]]||'', adj=((d._adj||{})['r'+r[0]])||[];
    html+=`<div class="req ${v}" id="q${r[0]}" data-n="${r[0]}">
      <div class="t"><span class="n">${r[0]}.</span>${esc(r[1])}</div>
      <div class="est">${['C','NC','NA'].map(k=>`<button class="${k} ${v===k?'on':''}" onclick="marca(${r[0]},'${k}')">${{C:'CUMPLE',NC:'NO CUMPLE',NA:'N/A'}[k]}</button>`).join('')}</div>
      ${v==='NC'||v==='NA'||o?`<textarea class="obs ${(v==='NC'||v==='NA')&&!o.trim()?'falta':''}" placeholder="${v==='NA'?'¿Por qué no aplica?':'¿Qué falta y dónde? Sé concreto.'}" onchange="obs(${r[0]},this.value)">${esc(o)}</textarea>`:''}
      <div class="adj">${adj.map(x=>chipAdj(x)).join('')}${pendientesHtml('r'+r[0])}
        ${d['foto_r'+r[0]]&&!adj.length?'<span class="pill">📷 foto en el teléfono de origen</span>':''}
        <button class="mini" onclick="adjuntar(${r[0]},'foto')">📷 Foto</button><button class="mini" onclick="adjuntar(${r[0]},'doc')">📎 Documento</button></div></div>`;
  });
  const firma=d._firma, cien=resp===total&&total>0;
  const hermanas=(PA.tipo==='svc'?pautasSvc(PA.svc):pautasRec(PA.rid)).map(x=>[PA.tipo+'|'+(PA.tipo==='svc'?PA.svc:PA.rid)+'|'+x,x]);
  $('app').innerHTML=`<div class="cols"><div class="izq solo-ancho"><h3>${esc(PA.lugar)}</h3>${hermanas.map(([k,x])=>itemPauta(k,x,k===clave)).join('')}</div><div><div id="prog"><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px">
      <b>${resp} de ${total} requisitos</b><span class="sub">${nc?nc+' no cumple':''}</span></div>
    <div class="barra"><i style="width:${total?resp*100/total:0}%"></i></div>

/* adjuntar: foto (comprimida) o documento (≤ 10 MB), desde el celular o arrastrando en el computador */
let ADJ_N=0;
function adjuntar(n,tipo){ADJ_N=n;const i=$(tipo==='foto'?'fFoto':'fDoc');i.value='';i.click();}
$('fFoto').onchange=e=>{const f=e.target.files[0];if(f)subir(f,ADJ_N);};

async function comprimir(f){
  if(!/^image\/(jpeg|png|webp|heic|heif)/.test(f.type)||f.size<350*1024)return f;
  try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.78));return new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'});}
  catch(e){return f;}
}
const MIMES=/^(application\/pdf|application\/msword|application\/vnd\.openxmlformats-officedocument\.(wordprocessingml\.document|spreadsheetml\.sheet|presentationml\.presentation)|application\/vnd\.ms-excel|image\/(jpeg|png|webp|heic|heif))$/;
async function subir(f,n){
  if(!PA)return; f=await comprimir(f);
  if(!MIMES.test(f.type)){toast('Ese tipo de archivo no se acepta. Usa PDF, Word, Excel o imagen.');return;}
  if(f.size>10*1024*1024){toast('El archivo pesa más de 10 MB.');return;}
  const b64=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.readAsDataURL(f);});
  const slot=n?'r'+n:'pauta';
  const nombre=(n?'R'+n+'_':'')+f.name.replace(/[\\/:*?"<>|]+/g,'-');
  await IDB.put({k:Date.now()+'_'+Math.random().toString(36).slice(2,6),clave:PA.clave,servicio:PA.svc,recinto:PA.rid,recNom:PA.recNom,pauta:PA.amb,slot,req:n||'',nombre,mime:f.type,b64});
  toast(navigator.onLine?'Subiendo '+nombre+'…':'Sin señal: se sube solo al volver la señal');
  pintaPendientes(); vaciarAdjuntos();
}
function activarArrastre(){
  const sobre=(el,n)=>{if(!el)return;
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag');});
    el.addEventListener('dragleave',()=>el.classList.remove('drag'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag');[...e.dataTransfer.files].forEach(f=>subir(f,n));});};
  document.querySelectorAll('.req').forEach(el=>sobre(el,Number(el.dataset.n)));
  sobre($('soltarPauta'),0);
}
async function verAdjunto(id,nombre){
  toast('Abriendo '+nombre+'…');
  try{const r=await apiGet({token:SES.token,archivo:id});
    if(!r.ok){toast('No se pudo abrir: '+(r.error||''));return;}
    const bin=atob(r.b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:r.mime}));
    if(/^image\//.test(r.mime)){hoja(`<h2 style="font-size:16px">${esc(nombre)}</h2><img src="${url}" style="width:100%;border-radius:12px"><p><button class="btn full" onclick="cerrarHoja()">Cerrar</button></p>`);}
    else{const a=document.createElement('a');a.href=url;a.download=nombre;a.target='_blank';document.body.appendChild(a);a.click();a.remove();}
  }catch(e){toast('Sin señal: no se pudo abrir el archivo.');}
}

async function confirmaRecintos(a){const rids=[...document.querySelectorAll('.lista-pick input:checked')].map(i=>i.value);cerrarHoja();
  if(rids.length)await asignarLote(rids.map(rid=>'rec|'+rid+'|'+a));}
function asgCatymey(R){
  const reglas=Object.entries(R.reglas).map(([k,v])=>{
    const pend=Object.entries(R.prop).filter(([rid,p])=>p[2]===k&&REC[rid]).flatMap(([rid,p])=>p[0].filter(a=>AMB[a]&&!pautasRec(rid).includes(a)).map(a=>'rec|'+rid+'|'+a));
    return {k,v,pend};}).filter(x=>x.pend.length).sort((a,b)=>b.pend.length-a.pend.length);
  return `<p class="sub">Cada regla de Catymey agrupa recintos del mismo tipo con su pauta y fundamento. Apruébala completa con un toque.</p>
    ${!reglas.length?'<div class="vacio">No quedan propuestas pendientes. 👍</div>':''}
    ${reglas.map(x=>`<div class="asg"><div class="cab"><b>${esc(x.k.replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()))}</b><span class="pill ${x.v.c==='alta'?'ok':'warn'}">${esc(x.v.c||'—')}</span></div>
      <p class="sub" style="margin:4px 0">${esc(x.v.f)}</p><p class="sub" style="margin:0 0 8px">${esc((x.v.ej||[]).join(' · '))}</p>
      <button class="btn acc full" onclick="aprobarRegla('${esc(x.k)}')">Aprobar · ${x.pend.length} asignaciones</button></div>`).join('')}`;
}
async function aprobarRegla(k){const R=window.ASR;
  const claves=Object.entries(R.prop).filter(([rid,p])=>p[2]===k&&REC[rid]).flatMap(([rid,p])=>p[0].filter(a=>AMB[a]&&!pautasRec(rid).includes(a)).map(a=>'rec|'+rid+'|'+a));
  if(!confirm('Aprobar «'+k.replace(/_/g,' ')+'»: '+claves.length+' asignaciones. ¿Seguro?'))return;
  await asignarLote(claves);render();}
function asgPuntos(R){
  const bloque=(svc,lista)=>{const ya=pautasSvc(svc),sug=lista.filter(x=>AMB[x[0]]&&!ya.includes(x[0]));sug.forEach(x=>MARCADAS.add('svc|'+svc+'|'+x[0]));
    return `<div class="asg"><div class="cab"><b>${esc(NIVELES[svc])}</b><button class="mini btn sec" style="min-height:36px" onclick="pickPauta('svc','${esc(svc)}')">＋</button></div>
      <div class="pa">${ya.map(a=>tagVig('svc|'+svc+'|'+a,a)).join('')}${sug.map(x=>tagSug('svc|'+svc+'|'+x[0],x[0],x[1]+' · '+x[2])).join('')}</div></div>`;};
  MARCADAS=new Set();
  const pts=D.puntos.map(p=>{const ya=pautasRec(p.id),sug=p.sug.filter(a=>!ya.includes(a));sug.forEach(a=>MARCADAS.add('rec|'+p.id+'|'+a));
    return `<div class="asg"><div class="cab"><b>${esc(p.n)}</b><button class="mini btn sec" style="min-height:36px" onclick="pickPauta('rec','${esc(p.id)}')">＋</button></div>
      <div class="pa">${ya.map(a=>tagVig('rec|'+p.id+'|'+a,a)).join('')}${sug.map(a=>tagSug('rec|'+p.id+'|'+a,a)).join('')}${!ya.length&&!sug.length?'<span class="sub">Sin norma digitalizada todavía: asígnala con ＋ cuando exista</span>':''}</div></div>`;}).join('');
  const cuerpo=`${bloque('HOSPITAL',R.hospital)}${bloque('EDIFICIO AA',R.edificio)}<h3>Puntos específicos</h3>${pts}`;
  return cuerpo+botonAplicar();
}

/* ── avance por servicio (referentes) ─────────────────────────────────── */
function vRevision(){
  if(!esRef())return sinAcceso();
  const xs=[...D.servicios.map(s=>s.n),'HOSPITAL','EDIFICIO AA'].map(n=>({n,a:avanceSvc(n)})).filter(x=>x.a.n).sort((a,b)=>a.a.p-b.a.p);

    ${xs.map(x=>`<button class="item" onclick="ir('#/s/${encodeURIComponent(x.n)}')"><span class="tx"><b>${esc(NIVELES[x.n]||x.n)}</b>
      <span class="sub">${x.a.listas} de ${x.a.n} pautas completas${SVC[x.n]&&SVC[x.n].resp.length?' · '+esc(SVC[x.n].resp[0]):''}</span></span>${ring(x.a.p)}</button>`).join('')}`;

function vNormas(arg){

      return h+`<div class="req"><div class="t" style="margin:0"><span class="n">${r[0]}.</span>${esc(r[1])}</div></div>`;}).join('');return;}
  titulo('Normas',Object.keys(D.normas).length+' normas digitalizadas');
  $('app').innerHTML=`<input class="buscar" placeholder="Buscar un ámbito o requisito…" oninput="filtra(this.value,'.item')">
    ${Object.entries(D.normas).map(([k,n])=>`<h3>${esc(n.n)}</h3>${n.s.flatMap(s=>s[1]).filter(a=>AMB[a]).map(a=>`<button class="item" data-q="${esc(nrm(nomAmb(a)+' '+AMB[a][4].map(r=>r[1]).join(' ')))}" onclick="ir('#/normas/${encodeURIComponent(a)}')">
      <span class="tx"><b>${esc(nomAmb(a))}</b><span class="sub">${AMB[a][4].length} requisitos</span></span></button>`).join('')}`).join('')}`;
}

/* ── expediente (referentes, lectura) ─────────────────────────────────── */
function vExpediente(){
  if(!esRef())return sinAcceso();
  titulo('Expediente de la solicitud','Trámites y documentos para la SEREMI');
  const pinta=()=>{const E=window.AS_EXPEDIENTE;if(!E){$('app').innerHTML='<div class="vacio">El expediente no está disponible aquí.</div>';return;}
    const docs=E.documentos||[], cuenta=k=>docs.filter(d=>(d.estado||'pendiente')===k).length;
    $('app').innerHTML=`<div class="card"><b>${cuenta('listo')} de ${docs.length}</b> documentos listos · <span class="sub">${cuenta('en_curso')} en curso · ${cuenta('por_verificar')} por verificar · ${cuenta('pendiente')} pendientes</span></div>
      ${E.aviso?`<div class="card" style="background:var(--warn-bg);border-color:#f5d37a">${E.aviso}</div>`:''}
      <h3>Trámites prioritarios</h3>${(E.tramites||[]).filter(t=>t.prioridad===1).map(t=>{const dd=docs.filter(d=>d.tramite===t.id);
        return `<details class="pl"><summary>${esc(t.nombre)}</summary><div><p class="sub">${esc(t.autoridad)} · ${esc(t.estado_actual||'')}</p>
        ${dd.slice(0,40).map(d=>`<p style="margin:6px 0"><span class="pill ${d.estado==='listo'?'ok':d.estado==='pendiente'?'no':'warn'}">${esc(d.estado||'pendiente')}</span> ${esc(d.nombre)}</p>`).join('')}</div></details>`;}).join('')}
      <a class="btn sec full" href="16.AutorizacionSanitaria.html#expediente">Editar en el Expediente completo</a>`;};
  if(window.AS_EXPEDIENTE)return pinta();
  $('app').innerHTML='<div class="esq"></div><div class="esq"></div>';
  const s=document.createElement('script');s.src='SHARED_DATA/as_expediente.js';s.onload=pinta;s.onerror=pinta;document.body.appendChild(s);
}

const demo={db:()=>LS.get('asdemo_db',{est:{},adj:{}}),
  async post(b){await new Promise(r=>setTimeout(r,250));const db=this.db();
    if(b.accion==='pedir_codigo')return /@/.test(b.correo)?{ok:true}:{ok:false,error:'Correo no válido'};
    if(b.accion==='validar_codigo'){if(b.codigo!=='123456')return {ok:false,error:'Código incorrecto. En demostración es 123456.'};
      const ref=/mpinto|csepulveda|mcanales|referente/.test(b.correo);
      return {ok:true,token:'demo-'+Date.now(),correo:b.correo,nombre:ref?'Referente (demo)':'Responsable (demo)',nivel:ref?'total':'servicio',
        servicios:ref?[]:[svcCanon(Q.get('s')||'OFTALMOLOGIA')],expira:new Date(Date.now()+30*864e5).toISOString()};}
    if(b.accion==='estado'){db.est[b.clave]={servicio:b.servicio,recinto:b.recinto,pauta:b.pauta,datos:b.datos,avance:b.avance,usuario:'demo',ts:new Date().toISOString()};LS.set('asdemo_db',db);return {ok:true};}
    if(b.accion==='lote'){b.items.forEach(it=>db.est[it.clave]={...it,usuario:'demo',ts:new Date().toISOString()});LS.set('asdemo_db',db);return {ok:true,guardados:b.items.length,rechazados:0};}
    if(b.accion==='adjunto'){const id='d'+Date.now();db.adj[id]={b64:b.b64,mime:b.mime,nombre:b.nombre};LS.set('asdemo_db',db);return {ok:true,id,nombre:b.nombre,mime:b.mime,kb:Math.round(b.b64.length*.75/1024)};}
    if(b.accion==='informe_html')return {ok:true,url:'#'};
    return {ok:true};},
  async get(p){await new Promise(r=>setTimeout(r,200));const db=this.db();
    if(p.archivo){const a=db.adj[p.archivo];return a?{ok:true,...a}:{ok:false,error:'no existe'};}
    return {ok:true,estados:db.est};}};
