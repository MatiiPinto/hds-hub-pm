<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coordinación de Capacitaciones · HDS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B5FA5'/><text x='50' y='70' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>H</text></svg>">
<style>
:root{
  --azul:#0B5FA5;--azul-osc:#084a82;--bg:#f4f6f9;--card:#fff;--bd:#e2e8f0;--tx:#1e293b;--tx2:#64748b;
  --e-ejec:#16a34a;--e-ejec-bg:#dcfce7;--e-coor:#2563eb;--e-coor-bg:#dbeafe;
  --e-porc:#b45309;--e-porc-bg:#fef3c7;--e-repr:#ea580c;--e-repr-bg:#ffedd5;--e-na:#64748b;--e-na-bg:#eef2f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:13px}
header{background:linear-gradient(135deg,var(--azul),var(--azul-osc));color:#fff;padding:14px 22px;position:sticky;top:0;z-index:30;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.hrow{display:flex;align-items:center;gap:14px;max-width:1500px;margin:0 auto;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:18px}
.htitle h1{font-size:18px;font-weight:700}.htitle p{font-size:12px;opacity:.85}
.htools{margin-left:auto;display:flex;gap:8px}
.btn{border:none;border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.btn:hover{background:rgba(255,255,255,.28)}
main{max-width:1500px;margin:0 auto;padding:16px 22px 50px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kpi h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);margin-bottom:7px;font-weight:700}
.kpi .big{font-size:26px;font-weight:800;color:var(--azul)}
.kpi .sub{font-size:11.5px;color:var(--tx2);margin-top:2px}
.kpi.combo{background:linear-gradient(135deg,#0B5FA5,#084a82);color:#fff}
.kpi.combo h3{color:rgba(255,255,255,.85)}.kpi.combo .big{color:#fff}.kpi.combo .sub{color:rgba(255,255,255,.8)}
.bar{height:8px;border-radius:5px;background:#e2e8f0;overflow:hidden;margin-top:9px;display:flex}
.bar i{display:block;height:100%}
.kpi.combo .bar{background:rgba(255,255,255,.25)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 2px 14px;font-size:11.5px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;color:var(--tx2)}
.tab.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.tab .c{font-size:11px;opacity:.8;margin-left:5px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px;align-items:center}
.filters input,.filters select{border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font-size:12.5px;background:#fff;color:var(--tx);max-width:230px}
.filters input[type=text]{min-width:220px}
.fcount{font-size:12px;color:var(--tx2);margin-left:auto}
.twrap{overflow:auto;border:1px solid var(--bd);border-radius:11px;background:#fff;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
thead th{background:var(--azul);color:#fff;position:sticky;top:0;padding:9px 10px;text-align:left;font-weight:600;font-size:11.5px;z-index:5}
tbody td{padding:6px 10px;border-bottom:1px solid #eef2f6;vertical-align:middle}
tbody tr:hover td{background:#f8fafc}
td.edit input,td.edit textarea{width:100%;min-width:90px;border:1px solid transparent;border-radius:5px;padding:4px 6px;font-size:12px;background:transparent;font-family:inherit;color:var(--tx)}
td.edit input:hover,td.edit textarea:hover{border-color:var(--bd);background:#fff}
td.edit input:focus,td.edit textarea:focus{border-color:var(--azul);background:#fff;outline:none}
.est-sel{border:none;border-radius:20px;padding:5px 9px;font-size:11.5px;font-weight:700;cursor:pointer;-webkit-appearance:none;appearance:none}
.e-ejecutada,.e-entregado{background:#dcfce7;color:#16a34a}
.e-coordinada{background:#fef9c3;color:#a16207}
.e-por_coordinar{background:#eef2f6;color:#64748b}
.e-por_entregar{background:#fef3c7;color:#b45309}
.e-reprogramada{background:#dbeafe;color:#2563eb}
.e-no_aplica{background:#ffffff;color:#64748b;border:1px solid #cbd5e1}
.e-pendiente{background:#fee2e2;color:#dc2626}
tr.row-ejecutada,tr.row-entregado{background:#f3fcf6}
tr.row-coordinada{background:#fffdf2}
tr.row-por_coordinar{background:#f8fafc}
tr.row-por_entregar{background:#fffdf5}
tr.row-reprogramada{background:#f4f8ff}
tr.row-no_aplica{background:#ffffff}
tr.row-pendiente{background:#fff5f5}
.estbar{width:5px;padding:0!important}
.eb-ejecutada,.eb-entregado{background:#16a34a}.eb-coordinada{background:#eab308}
.eb-por_coordinar{background:#94a3b8}.eb-por_entregar{background:#f59e0b}.eb-reprogramada{background:#3b82f6}.eb-no_aplica{background:#e2e8f0}.eb-pendiente{background:#ef4444}
.muted{color:var(--tx2)}
.slotcell{min-width:245px}
.slots{display:flex;flex-direction:column;gap:4px}
.slot{display:flex;gap:4px;align-items:center}
.slot input[type=date]{width:118px;border:1px solid var(--bd);border-radius:5px;padding:3px 5px;font-size:11px;font-family:inherit}
.slot-h{width:90px;border:1px solid var(--bd);border-radius:5px;padding:3px 5px;font-size:11px;font-family:inherit}
.slot-x{border:none;background:#fee2e2;color:#dc2626;border-radius:5px;cursor:pointer;font-size:13px;width:20px;height:23px;line-height:1;padding:0}
.slot-add{border:1px dashed var(--azul);background:#eef6fc;color:var(--azul);border-radius:5px;cursor:pointer;font-size:11px;padding:3px 8px;align-self:flex-start}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{background:#0a558f}
.bulkbar{display:none;align-items:center;gap:12px;background:#0B5FA5;color:#fff;border-radius:10px;padding:9px 14px;margin-bottom:11px;font-size:13px;flex-wrap:wrap}
.bulkbar.show{display:flex}
.bulkbar b{font-weight:800}
.bulkbar select{border:none;border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;color:#1e293b}
.bulkbar button{border:none;border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.bb-apply{background:#16a34a;color:#fff}.bb-clear{background:rgba(255,255,255,.22);color:#fff}
.chk{width:15px;height:15px;cursor:pointer}

/* ── Seguimiento de jornadas propuestas a la CSSO (cap_seguimiento.js) ───── */
.segbadge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;text-align:center}
.segmask{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:26px 16px;overflow:auto}
.segmask.on{display:flex}
.segbox{background:var(--card);border-radius:14px;width:100%;max-width:1000px;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden}
.seghd{background:linear-gradient(135deg,var(--azul),var(--azul-osc));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seghd h2{font-size:15.5px;font-weight:700}
.seghd .sub{font-size:11.5px;opacity:.85;width:100%}
.seghd .x{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:7px;padding:5px 10px;font-size:14px;font-weight:700;cursor:pointer}
.segbd{padding:16px 18px;max-height:64vh;overflow:auto}
.segq{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:3px}
.segmeta{font-size:12px;color:var(--tx2);margin-bottom:12px}
.segeq{border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:12px}
.segeq label{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:12.5px}
.segeq label:last-child{border-bottom:none}
.segeq label:hover{background:#f8fafc}
.segeq input{margin-top:2px}
.segeq .cod{font-weight:700;color:var(--azul)}
.segeq .prov{color:var(--tx2);font-size:11.5px;display:block}
.segnota{width:100%;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit}
.segft{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f8fafc}
.segft .muted{margin-right:auto}
.sbtn{border:none;border-radius:8px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:#fff}
.sb-si{background:#16a34a}.sb-no{background:#ea580c}.sb-lat{background:#64748b}.sb-gh{background:#e2e8f0;color:#334155}
.sbtn:hover{filter:brightness(1.08)}
.segtb{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.segtb th{background:#f1f5f9;color:var(--tx2);text-align:left;padding:7px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
.segtb td{padding:7px 9px;border-top:1px solid var(--bd);vertical-align:top}
.segtb col.c-n{width:4%}.segtb col.c-f{width:10%}.segtb col.c-h{width:7%}
.segtb col.c-sv{width:21%}.segtb col.c-eq{width:37%}.segtb col.c-e{width:12%}.segtb col.c-a{width:9%}
.segtb th,.segtb td{white-space:normal}
.segtb td{overflow-wrap:anywhere;word-break:break-word}
.segtb td:nth-child(5){font-size:11.5px;line-height:1.45}
.segtb td:nth-child(1),.segtb td:nth-child(3){white-space:nowrap;color:var(--tx2)}
.segtb td:nth-child(2){white-space:nowrap;font-weight:600}
.segtb td:nth-child(4){line-height:1.35}
.segtb tr:hover td{background:#f8fafc}
.segtb .lnk{background:none;border:none;color:var(--azul);font-weight:700;cursor:pointer;font-size:11.5px;padding:0;text-decoration:underline}
.segpill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.sp-si{background:var(--e-ejec-bg);color:#166534}.sp-no{background:var(--e-repr-bg);color:#9a3412}
.sp-esp{background:#fee2e2;color:#991b1b}.sp-fut{background:#eef2f6;color:#475569}
.segtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.segtabs button{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer}
.segtabs button.on{background:var(--azul);border-color:var(--azul);color:#fff}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">HDS</div>
    <div class="htitle"><h1>Coordinación de Capacitaciones</h1><p>Hospital del Salvador · Programa de Capacitación · Instructivos de Uso · Instrumental</p></div>
    <div class="htools">
      <span id="capUpdInfo" style="font-size:11px;color:#94a3b8;text-align:right;line-height:1.35"></span>
      <button class="btn" id="btnCapUpd" onclick="actualizarDesdeExcel()" title="Vuelve a leer la hoja '4. Prog Capacitacion HDS' del Excel de Seguimiento y Control (Drive sincronizado) y regenera la reportería. Requiere el servidor local: python3 _DEV/deploy_server.py (o usá Actualizar-Capacitaciones.command).">⟳ Actualizar desde Excel</button>
      <button class="btn" id="btnSeg" onclick="segAbrir()" title="Jornadas propuestas a la CSSO (89 correos enviados el 20-08-2026): fechas cargadas y registro de ejecución.">🎓 Jornadas CSSO<span class="segbadge" id="segBadge" style="display:none">0</span></button>
      <button class="btn" onclick="exportCSV()">⬇ Exportar CSV</button>

</header>
<main>
  <div class="dash" id="dash"></div>

  <div class="bulkbar" id="bulkbar"></div>

</main>

<!-- cap_data se pide con URL única por carga: el navegador no puede servir
     una copia vieja (Safari cacheaba la versión de días atrás y la reportería
     se veía desactualizada aunque el Excel ya estuviera importado) -->
<div class="segmask" id="segMask"><div class="segbox">
  <div class="seghd"><h2 id="segTit">Jornadas propuestas a la CSSO</h2><button class="x" onclick="segCerrar()" title="Cerrar">×</button><div class="sub" id="segSub"></div></div>
  <div class="segbd" id="segBody"></div>
  <div class="segft" id="segFoot"></div>
</div></div>

<script>document.write('<scr'+'ipt src="SHARED_DATA/cap_data.js?v='+Date.now()+'"></scr'+'ipt>');</script>
<!-- capa de seguimiento: las 89 jornadas propuestas a la CSSO (correos del 20-08-2026) -->
<script>document.write('<scr'+'ipt src="SHARED_DATA/cap_seguimiento.js?v='+Date.now()+'"></scr'+'ipt>');</script>
<script>
"use strict";
var D = window.CAP_DATA;
var IDX={}; ["capacitaciones","instructivos","instrumental"].forEach(function(a){D[a].forEach(function(r){IDX[r.id]=r;});});
var STORE_KEY = "hds_coordcap_v1";

// estados por área
var ST5 = [
  {k:"ejecutada",lbl:"Ejecutada"},{k:"coordinada",lbl:"Coordinada"},
  {k:"por_coordinar",lbl:"En Coordinación"},{k:"reprogramada",lbl:"Reprogramada"},{k:"no_aplica",lbl:"No aplica"}
];
var ST_CAP = [
  {k:"ejecutada",lbl:"Ejecutada"},{k:"coordinada",lbl:"Coordinada"},
  {k:"por_coordinar",lbl:"En Coordinación"},{k:"pendiente",lbl:"En CSSO"},{k:"reprogramada",lbl:"Reprogramada"},{k:"no_aplica",lbl:"No aplica"}
];
var ESTADOS = {
  capacitaciones: ST_CAP,
  instrumental:   ST5,
  instructivos:   [{k:"entregado",lbl:"Entregado"},{k:"por_entregar",lbl:"Por entregar"}]
};
var DEFAULT_EST={capacitaciones:"por_coordinar",instrumental:"por_coordinar",instructivos:"por_entregar"};
var DONE={capacitaciones:"ejecutada",instrumental:"ejecutada",instructivos:"entregado"};
var DONE_WORD={capacitaciones:"ejecutadas",instrumental:"ejecutadas",instructivos:"entregados"};
var EST_HEX={ejecutada:"#16a34a",coordinada:"#eab308",por_coordinar:"#94a3b8",reprogramada:"#3b82f6",no_aplica:"#cbd5e1",pendiente:"#ef4444",
             entregado:"#16a34a",por_entregar:"#f59e0b"};
var EST_LBL={};Object.keys(ESTADOS).forEach(function(a){ESTADOS[a].forEach(function(e){EST_LBL[e.k]=e.lbl;});});
function validKeys(area){return ESTADOS[area].map(function(e){return e.k;});}

var COLS = {
  capacitaciones:[
    {key:"codigo",label:"Código"},{key:"equipo",label:"Equipo"},
    {key:"lugar",label:"Lugar",edit:1},{key:"_slots",label:"Fechas/horas propuestas",slots:1},
    {key:"participantes",label:"Particip.",edit:1},
    {key:"proveedor",label:"Proveedor"},{key:"marca",label:"Marca"},{key:"modelo",label:"Modelo"},
    {key:"duracion",label:"Duración",edit:1},{key:"cant_equipos",label:"Cant. eq."},
    {key:"establecimiento",label:"Estab."},{key:"tipo_entrenamiento",label:"Tipo entren."},
    {key:"propuesta_adelantar",label:"Prop. adelantar",edit:1},{key:"detalle_servicios",label:"Servicio clínico"}
  ],
  instructivos:[
    {key:"codigo",label:"Código"},{key:"equipo",label:"Equipo"},{key:"cant_equipos",label:"Cant. eq."},
    {key:"establecimiento",label:"Estab."},{key:"proveedor",label:"Proveedor"},{key:"marca",label:"Marca"},
    {key:"modelo",label:"Modelo"},{key:"detalle_servicios",label:"Servicio clínico"},
    {key:"fecha_coord",label:"Fecha entrega",edit:1,type:"date"}
  ],
  instrumental:[
    {key:"codigo",label:"Código"},{key:"especialidad",label:"Especialidad"},{key:"caja",label:"Caja"},
    {key:"cant_cajas",label:"Cant. cajas"},{key:"piezas_caja",label:"Piezas/caja"},{key:"piezas_total",label:"Piezas tot."},
    {key:"proveedor",label:"Proveedor"},{key:"marca",label:"Marca"},
    {key:"_slots",label:"Fechas propuestas",slots:1}
  ]
};
var AREAS=[["capacitaciones","Programa de Capacitación"],["instructivos","Instructivos de Uso"],["instrumental","Instrumental"]];
// filtros desplegables por área
var FILTERFIELDS={
  capacitaciones:["establecimiento","proveedor","marca","detalle_servicios"],
  instructivos:["establecimiento","proveedor"],
  instrumental:["especialidad","proveedor"]
};

var overrides = load();
(function(){ var FLAG=window.CAP_IMPORT_FLAG||"hds_coordcap_capimport_2026jun26b";
  if(!localStorage.getItem(FLAG)){
    // El Excel manda SOLO sobre lo que ya conocía: en cada import se limpian
    // los ajustes locales ANTERIORES a la edición del Excel. Lo ingresado en
    // la plataforma DESPUÉS (sellado con _ts por ov()) sobrevive hasta que
    // llegue un Excel más nuevo que lo incorpore.
    var excelTs=0;
    try{ if(window.CAP_EXCEL_MOD) excelTs=new Date(window.CAP_EXCEL_MOD.replace(' ','T')).getTime()||0; }catch(e){}
    Object.keys(overrides).forEach(function(id){
      if(id.indexOf("cap-")!==0&&id.indexOf("ins-")!==0&&id.indexOf("instr-")!==0) return;
      var o=overrides[id]||{};
      if(!o._ts || o._ts<=excelTs) delete overrides[id];   // viejo → el Excel manda
    });
    localStorage.setItem(STORE_KEY, JSON.stringify(overrides));
    localStorage.setItem(FLAG,"1");
  }
})();
var active = "capacitaciones";
var filtro = {q:"",estado:"",fields:{}};
var selected = {};
var sortBy = {key:null,dir:1};

function load(){ try{return JSON.parse(localStorage.getItem(STORE_KEY)||"{}");}catch(e){return {};} }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(overrides)); }
// cada ajuste local queda SELLADO con fecha (_ts): el import del Excel solo
// borra ajustes ANTERIORES a la edición del Excel — lo ingresado después
// (aún no reflejado en la planilla) sobrevive.
function ov(id){ var o=overrides[id]||(overrides[id]={}); o._ts=Date.now(); return o; }
function areaOf(id){ return id.indexOf("cap-")===0?"capacitaciones":(id.indexOf("ins-")===0?"instructivos":"instrumental"); }
function estadoOf(area,row){
  var o=overrides[row.id]; var v=(o&&o.estado)||row._estado||DEFAULT_EST[area];
  if(validKeys(area).indexOf(v)<0) v=DEFAULT_EST[area];
  return v;
}
function valOf(row,key){ if(key==="_slots") return slotsText(row); var o=overrides[row.id]; if(o&&o.fields&&o.fields[key]!=null) return o.fields[key]; return row[key]!=null?row[key]:""; }
function slotsOf(r){ var o=overrides[r.id]; if(o&&o.slots) return o.slots; return r._slots||[]; }
function ensureSlots(id){ var o=ov(id); if(!o.slots){ o.slots=((IDX[id]&&IDX[id]._slots)||[]).map(function(s){return {f:s.f,h:s.h};}); } return o.slots; }
function slotsText(r){ return slotsOf(r).map(function(s){return (s.f||"")+" "+(s.h||"");}).join(" | "); }
function slotsCell(r){
  var slots=slotsOf(r), h='<td class="slotcell"><div class="slots">';
  slots.forEach(function(s,i){
    h+='<div class="slot"><input type="date" value="'+esc(s.f||"")+'" onchange="setSlot(\''+r.id+'\','+i+',\'f\',this.value)">'+
       '<input type="text" class="slot-h" placeholder="hora" value="'+esc(s.h||"")+'" onchange="setSlot(\''+r.id+'\','+i+',\'h\',this.value)">'+
       '<button class="slot-x" onclick="delSlot(\''+r.id+'\','+i+')" title="Quitar fecha">\u00d7</button></div>';
  });
  h+='<button class="slot-add" onclick="addSlot(\''+r.id+'\')">+ fecha</button></div></td>';
  return h;
}
function addSlot(id){ ensureSlots(id).push({f:"",h:""}); save(); renderTable(); }
function delSlot(id,i){ var a=ensureSlots(id); a.splice(i,1); save(); renderTable(); }
function setSlot(id,i,f,v){ var a=ensureSlots(id); if(a[i]){ a[i][f]=v; save(); } }
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}

function counts(area){
  var c={total:0}; validKeys(area).forEach(function(k){c[k]=0;});
  D[area].forEach(function(r){ c[estadoOf(area,r)]++; c.total++; });
  return c;
}
// % SIEMPRE sobre el TOTAL del área (criterio Matías jul-2026): los "No
// aplica" de capacitaciones significan "aún no se puede avanzar" — esas
// capacitaciones SÍ se harán, así que cuentan en el universo (77/250).
function pctArea(area,c){
  return c.total>0?Math.round((c[DONE[area]]||0)/c.total*100):0;
}
function barArea(area,c){
  var t=c.total||1,h='<div class="bar">';
  validKeys(area).forEach(function(k){ h+='<i style="width:'+((c[k]||0)/t*100).toFixed(2)+'%;background:'+EST_HEX[k]+'"></i>'; });
  return h+'</div>';
}
// Instrumental ponderado por CAJAS FÍSICAS: cada tipo pesa su cant_cajas,
// así el % refleja las ~1.500+ cajas reales y no solo los ~196 tipos.
function cajasCounts(){
  var c={total:0}; validKeys("instrumental").forEach(function(k){c[k]=0;});
  D.instrumental.forEach(function(r){
    var q=parseInt(String(valOf(r,"cant_cajas")).replace(/\D/g,""),10)||1;
    c[estadoOf("instrumental",r)]+=q; c.total+=q;
  });
  return c;
}
function comboStats(areas){
  // mismo criterio que pctArea: completados sobre el TOTAL (sin excluir No aplica)
  var done=0,total=0;
  areas.forEach(function(a){var c=counts(a); done+=c[DONE[a]]||0; total+=c.total;});
  return {done:done,total:total,base:total,pct:total>0?Math.round(done/total*100):0};
}
function writeSummary(){
  var areas=["capacitaciones","instructivos","instrumental"];
  var gd=0,gt=0;
  areas.forEach(function(a){ var c=counts(a); gd+=(c[DONE[a]]||0); gt+=c.total; });
  var gpct= gt>0?Math.round(gd/gt*100):0;
  var cc=counts("capacitaciones");
  var sum={ts:Date.now(),
    global:{done:gd,total:gt,pct:gpct},
    capacitaciones:{done:(cc[DONE.capacitaciones]||0),total:cc.total,pct:pctArea("capacitaciones",cc)}};
  try{ localStorage.setItem("hds_coordcap_summary", JSON.stringify(sum)); }catch(e){}
}
function barDone(p){ return '<div class="bar"><i style="width:'+p.toFixed(2)+'%;background:var(--e-ejec)"></i></div>'; }

function renderDash(){
  var h="";
  AREAS.forEach(function(a){
    var c=counts(a[0]);
    if(a[0]==="instrumental"){
      // % por TIPOLOGÍAS de caja; las cajas físicas quedan como referencia
      var cw=cajasCounts();
      h+='<div class="kpi"><h3>'+a[1]+'</h3><div class="big">'+pctArea("instrumental",c)+'%</div>'+
         '<div class="sub">'+(c[DONE.instrumental]||0)+' de '+c.total+' tipologías · '+(cw[DONE.instrumental]||0)+'/'+cw.total+' cajas</div>'+barArea("instrumental",c)+'</div>';
      return;
    }
    h+='<div class="kpi"><h3>'+a[1]+'</h3><div class="big">'+pctArea(a[0],c)+'%</div>'+
       '<div class="sub">'+(c[DONE[a[0]]]||0)+' '+DONE_WORD[a[0]]+' de '+c.total+'</div>'+barArea(a[0],c)+'</div>';
  });
  // los GLOBALES (tarjetas azules) van primero; después el detalle por área
  var c1=comboStats(["capacitaciones","instructivos"]);
  var c2=comboStats(["capacitaciones","instructivos","instrumental"]);
  var subCombo=function(c){ return c.done+' completadas de '+c.total; };
  var combos=
    '<div class="kpi combo"><h3>Combinado · las 3 áreas (+ Instrumental)</h3><div class="big">'+c2.pct+'%</div>'+
    '<div class="sub">'+subCombo(c2)+'</div>'+barDone(c2.pct)+'</div>'+
    '<div class="kpi combo"><h3>Combinado · Capac. + Instructivos</h3><div class="big">'+c1.pct+'%</div>'+
    '<div class="sub">'+subCombo(c1)+'</div>'+barDone(c1.pct)+'</div>';
  document.getElementById("dash").innerHTML=combos+h;
  writeSummary();
}
function renderLegend(){
  document.getElementById("legend").innerHTML=
    '<span class="muted" style="font-weight:600">'+AREAS.filter(function(a){return a[0]===active;})[0][1]+':</span>'+
    ESTADOS[active].map(function(e){return '<span><i class="dot" style="background:'+EST_HEX[e.k]+'"></i>'+e.lbl+'</span>';}).join("")+
    '<span class="muted">· El % cuenta '+DONE_WORD[active]+' sobre el TOTAL del área (los "No aplica" aún no gestionables también cuentan)</span>';
}
function renderTabs(){
  document.getElementById("tabs").innerHTML=AREAS.map(function(a){
    return '<button class="tab'+(active===a[0]?' on':'')+'" onclick="setArea(\''+a[0]+'\')">'+a[1]+'<span class="c">'+D[a[0]].length+'</span></button>';
  }).join("");
}
function setArea(a){ active=a; filtro={q:"",estado:"",fields:{}}; selected={}; sortBy={key:null,dir:1}; renderTabs(); renderLegend(); renderFilters(); renderBulk(); renderTable(); }

function uniq(area,key){var s={};D[area].forEach(function(r){var v=valOf(r,key);if(v)s[v]=1;});return Object.keys(s).sort();}
function colByKey(k){return COLS[active].filter(function(c){return c.key===k;})[0]||{label:k};}
function renderFilters(){
  var h='<input type="text" id="fq" placeholder="Buscar…" value="'+esc(filtro.q)+'" oninput="filtro.q=this.value;renderTable()">';
  h+='<select onchange="filtro.estado=this.value;renderTable()"><option value="">Todos los estados</option>'+
     ESTADOS[active].map(function(e){return '<option value="'+e.k+'"'+(filtro.estado===e.k?' selected':'')+'>'+e.lbl+'</option>';}).join("")+'</select>';
  FILTERFIELDS[active].forEach(function(fk){
    var col=colByKey(fk), cur=filtro.fields[fk]||"";
    h+='<select onchange="setFieldFilter(\''+fk+'\',this.value)"><option value="">'+col.label+': todos</option>'+
       uniq(active,fk).map(function(v){return '<option'+(cur===v?' selected':'')+'>'+esc(v)+'</option>';}).join("")+'</select>';
  });
  h+='<span class="fcount" id="fcount"></span>';
  document.getElementById("filters").innerHTML=h;
}
function setFieldFilter(fk,v){ if(v) filtro.fields[fk]=v; else delete filtro.fields[fk]; renderTable(); }

function filtered(){
  var q=filtro.q.toLowerCase();
  return D[active].filter(function(r){
    if(filtro.estado && estadoOf(active,r)!==filtro.estado) return false;
    for(var fk in filtro.fields){ if(valOf(r,fk)!==filtro.fields[fk]) return false; }
    if(q){ var hay=COLS[active].some(function(c){return (valOf(r,c.key)+"").toLowerCase().indexOf(q)>-1;}); if(!hay) return false; }
    return true;
  });
}
function renderTable(){
  var cols=COLS[active];
  var rows=filtered();
  if(sortBy.key){
    rows=rows.slice().sort(function(a,b){
      var va=sortBy.key==='_estado'?lblOf(active,estadoOf(active,a)):valOf(a,sortBy.key);
      var vb=sortBy.key==='_estado'?lblOf(active,estadoOf(active,b)):valOf(b,sortBy.key);
      return (''+va).localeCompare(''+vb,'es',{numeric:true,sensitivity:'base'})*sortBy.dir;
    });
  }
  var allSel=rows.length>0 && rows.every(function(r){return selected[r.id];});
  document.getElementById("thead").innerHTML='<tr><th class="estbar"></th>'+
    '<th><input type="checkbox" class="chk" '+(allSel?'checked':'')+' onclick="toggleAll(this.checked)" title="Seleccionar todos"></th>'+
    '<th class="sortable" onclick="setSort(\'_estado\')">Estado'+arrow('_estado')+'</th>'+
    cols.map(function(c){return '<th class="sortable" onclick="setSort(\''+c.key+'\')">'+c.label+arrow(c.key)+'</th>';}).join("")+'<th>Notas coordinación</th></tr>';
  var tb=rows.map(function(r){
    var est=estadoOf(active,r);
    var sel='<select class="est-sel e-'+est+'" onchange="setEstado(\''+r.id+'\',this.value)">'+
      ESTADOS[active].map(function(e){return '<option value="'+e.k+'"'+(est===e.k?' selected':'')+'>'+e.lbl+'</option>';}).join("")+'</select>';
    var tds=cols.map(function(c){
      if(c.slots) return slotsCell(r);
      var v=valOf(r,c.key);
      if(c.edit) return '<td class="edit"><input type="'+(c.type||"text")+'" value="'+esc(v)+'" onchange="setField(\''+r.id+'\',\''+c.key+'\',this.value)"></td>';
      return '<td>'+esc(v)+'</td>';
    }).join("");
    var notas=(overrides[r.id]&&overrides[r.id].notas)||"";
    var ncell='<td class="edit"><input type="text" value="'+esc(notas)+'" placeholder="…" onchange="setNotas(\''+r.id+'\',this.value)" style="min-width:160px"></td>';
    return '<tr class="row-'+est+'"><td class="estbar eb-'+est+'"></td>'+'<td><input type="checkbox" class="chk" '+(selected[r.id]?'checked':'')+' onclick="toggleSel(\''+r.id+'\',this.checked)"></td>'+'<td>'+sel+'</td>'+tds+ncell+'</tr>';
  }).join("");
  document.getElementById("tbody").innerHTML=tb||'<tr><td colspan="24" style="padding:30px;text-align:center" class="muted">Sin resultados.</td></tr>';
  var fc=document.getElementById("fcount"); if(fc) fc.textContent=rows.length+" de "+D[active].length;
}
function setEstado(id,v){ ov(id).estado=v; save(); renderDash(); renderTable(); }
function setField(id,key,v){ var o=ov(id); (o.fields=o.fields||{})[key]=v; save(); }
function setNotas(id,v){ ov(id).notas=v; save(); }
function resetEstados(){ if(confirm("¿Borrar todos los estados y anotaciones guardados y volver al estado inicial?")){ overrides={}; save(); renderDash(); renderTable(); } }
function exportCSV(){
  var cols=COLS[active];
  var head=["Estado"].concat(cols.map(function(c){return c.label;})).concat(["Notas"]);
  var lines=[head.map(q).join(",")];
  filtered().forEach(function(r){
    var row=[lblOf(active,estadoOf(active,r))].concat(cols.map(function(c){return valOf(r,c.key);})).concat([(overrides[r.id]&&overrides[r.id].notas)||""]);
    lines.push(row.map(q).join(","));
  });
  var blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="coordinacion_"+active+"_HDS.csv";a.click();
}
function q(v){v=(v==null?"":""+v);return '"'+v.replace(/"/g,'""')+'"';}
function lblOf(area,k){var e=ESTADOS[area].filter(function(x){return x.k===k;})[0];return e?e.lbl:k;}
function arrow(k){ return sortBy.key===k?(sortBy.dir>0?' \u25B2':' \u25BC'):''; }
function setSort(k){ if(sortBy.key===k) sortBy.dir*=-1; else { sortBy.key=k; sortBy.dir=1; } renderTable(); }

function toggleSel(id,ch){ if(ch) selected[id]=true; else delete selected[id]; renderBulk(); syncSelAll(); }
function toggleAll(ch){ filtered().forEach(function(r){ if(ch) selected[r.id]=true; else delete selected[r.id]; }); renderTable(); renderBulk(); }
function syncSelAll(){ var rows=filtered(); var all=rows.length>0&&rows.every(function(r){return selected[r.id];}); var b=document.querySelector('#thead .chk'); if(b) b.checked=all; }
function selCount(){ return Object.keys(selected).length; }
function renderBulk(){
  var n=selCount(); var bb=document.getElementById("bulkbar");
  if(n===0){ bb.className="bulkbar"; bb.innerHTML=""; return; }
  bb.className="bulkbar show";
  bb.innerHTML='<b>'+n+'</b> seleccionado'+(n>1?'s':'')+
    ' · Cambiar estado a: <select id="bulkSel">'+
    ESTADOS[active].map(function(e){return '<option value="'+e.k+'">'+e.lbl+'</option>';}).join("")+'</select>'+
    '<button class="bb-apply" onclick="applyBulk()">Aplicar a seleccionados</button>'+
    '<button class="bb-clear" onclick="clearSel()">Limpiar selección</button>';
}
function applyBulk(){
  var v=document.getElementById("bulkSel").value;
  Object.keys(selected).forEach(function(id){ ov(id).estado=v; });
  save(); selected={}; renderDash(); renderTable(); renderBulk();
}
function clearSel(){ selected={}; renderTable(); renderBulk(); }

renderDash();renderTabs();renderLegend();renderFilters();renderBulk();renderTable();

<!-- ══════════════════════════════════════════════════════════════════════════
     SEGUIMIENTO DE JORNADAS PROPUESTAS A LA CSSO
     Fuente: SHARED_DATA/cap_seguimiento.js (89 correos enviados el 20-08-2026).
       1) SIEMBRA: carga en cada tipologia la fecha/hora propuesta y la deja
          "En CSSO" (sin pisar lo ya ejecutado/coordinado). Una vez por version.
       2) POP-UP: al entrar, si hay jornadas cuya fecha ya paso y no estan
          respondidas, pregunta si se realizaron. La respuesta escribe el
          estado de cada tipologia -> y con eso se recalcula el avance global.
     Estado local propio en localStorage "hds_coordcap_seg_v1" (respuestas y
     postergaciones); los estados viven donde siempre (hds_coordcap_v1).
     Debug: ?hoy=YYYY-MM-DD simula la fecha; ?seg=0 desactiva el pop-up.
     ══════════════════════════════════════════════════════════════════════ -->
<script>
"use strict";
(function(){
var SEG = window.CAP_SEG;
if(!SEG || !SEG.jornadas || !SEG.jornadas.length) return;
var QS = new URLSearchParams(location.search);
// En las copias de consulta (HUB PM / publico) las fechas se ven, pero el
// registro de ejecucion NO: la respuesta la lleva Matias en su plataforma.
var RO = !!window.PUBLIC;
var SKEY = "hds_coordcap_seg_v1";
var S; try{ S = JSON.parse(localStorage.getItem(SKEY)||"{}"); }catch(e){ S = {}; }
S.resp = S.resp || {}; S.snooze = S.snooze || {};
function ssave(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }
function p2(n){ return (n<10?"0":"")+n; }
function hoy(){ var f=QS.get("hoy"); if(f && /^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  var d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function ahora(){ if(QS.get("hoy")) return "23:59"; var d=new Date(); return p2(d.getHours())+":"+p2(d.getMinutes()); }
function dmy(f){ return f?f.slice(8,10)+"-"+f.slice(5,7)+"-"+f.slice(0,4):""; }

// codigo -> fila de capacitaciones (los 136 codigos calzan 1:1 con CAP_DATA)
var BYCOD={}; D.capacitaciones.forEach(function(r){ BYCOD[String(r.codigo).trim()]=r; });
function filas(j){ var o=[]; j.equipos.forEach(function(e){ var r=BYCOD[e.cod]; if(r) o.push(r); }); return o; }
function esc2(s){ return esc(s); }

// Una misma tipologia puede capacitarse en VARIOS servicios clinicos, o sea
// en varias jornadas (136 tipologias -> 206 pares servicio-jornada). El estado
// de la fila se deduce de TODAS sus jornadas, no de la ultima respondida.
var JXROW={};   // id de fila -> [jornadas]
SEG.jornadas.forEach(function(j){
  filas(j).forEach(function(r){ (JXROW[r.id] = JXROW[r.id] || []).push(j); });
});
var NOTA_PFX = "Jornada CSSO: ";
function slotsDe(js){ var v={}, o=[]; js.forEach(function(j){ var k=j.fecha+" "+j.hora;
  if(!v[k]){ v[k]=1; o.push({f:j.fecha, h:j.hora}); } }); return o; }
function hechoEn(j, cod){ var r=S.resp[j.key]; return !!(r && r.r==="si" && r.ejec.indexOf(cod)>=0); }

// ── 1. SIEMBRA de fechas propuestas ────────────────────────────────────────
(function siembra(){
  if(S.seed === SEG.version) return;
  var n=0;
  Object.keys(JXROW).forEach(function(id){
    var r=IDX[id], est=estadoOf("capacitaciones", r);
    if(est==="ejecutada" || est==="coordinada") return;      // no piso lo ya avanzado
    var o=ov(id);
    o.slots  = slotsDe(JXROW[id]);
    o.estado = "pendiente";                                   // = 2.CSSO del Excel
    if(!o.fields) o.fields={};
    if(SEG.lugar) o.fields.lugar = SEG.lugar;
    n++;
  });
  S.seed = SEG.version; ssave(); save();
  if(n && window.renderDash){ renderDash(); renderTable(); }
  if(window.console) console.log("[seguimiento CSSO] fechas cargadas en "+n+" tipologias ("+
    SEG.jornadas.length+" jornadas, "+SEG.jornadas.reduce(function(a,j){return a+j.equipos.length;},0)+" pares servicio-jornada)");
})();

// ── 2. cola de jornadas por confirmar ──────────────────────────────────────
function vencida(j){ var h=hoy(); return j.fecha < h || (j.fecha===h && ahora() >= j.fin); }
function pendientes(){
  return SEG.jornadas.filter(function(j){
    return !S.resp[j.key] && vencida(j);
  });
}
function porPreguntar(){
  var h=hoy();
  return pendientes().filter(function(j){ return S.snooze[j.key] !== h; });
}
function estadoJor(j){
  var r=S.resp[j.key];
  if(r) return r.r==="si" ? (r.ejec && r.ejec.length===j.equipos.length ? "si" : "parcial") : "no";
  return vencida(j) ? "esp" : "fut";
}

// ── 3. modal ───────────────────────────────────────────────────────────────
var mask=document.getElementById("segMask"), tit=document.getElementById("segTit"),
    sub=document.getElementById("segSub"), body=document.getElementById("segBody"),
    foot=document.getElementById("segFoot");
var cola=[], iq=0, vista="pend";

function segCerrar(){ mask.className="segmask"; pintaBadge(); }
function segAbrir(v){ cola=porPreguntar(); iq=0; vista = RO ? "todas" : (v || (cola.length?"pend":"todas")); pinta(); mask.className="segmask on"; }
window.segAbrir=segAbrir; window.segCerrar=segCerrar;

function pintaBadge(){
  var b=document.getElementById("segBadge"); if(!b) return;
  var n=pendientes().length;
  b.textContent=n; b.style.display = n ? "inline-block" : "none";
}

function pinta(){ if(vista==="pend" && cola.length) pintaPregunta(); else pintaLista(); }

function pintaPregunta(){
  var j=cola[iq];
  if(!j){ vista="todas"; pintaLista(); return; }
  tit.textContent="¿Se realizó esta capacitación?";
  sub.textContent="Jornada "+(iq+1)+" de "+cola.length+" por confirmar · propuestas enviadas a la CSSO el 20-08-2026";
  var h='<div class="segq">'+esc2(j.servicio)+'</div>'+
        '<div class="segmeta">'+esc2(j.fecha_larga)+' · bloque '+esc2(j.hora)+' a '+esc2(j.fin)+
        ' · '+esc2(j.bloque_nom)+' · '+esc2(SEG.lugar)+'</div>'+
        '<div class="segmeta" style="margin-top:-8px">Destildá el equipamiento que <b>no</b> se alcanzó a capacitar; queda como reprogramado.</div>'+
        '<div class="segeq">';
  j.equipos.forEach(function(e,i){
    var row=BYCOD[e.cod], otras=(row?(JXROW[row.id]||[]):[]).filter(function(x){return x.key!==j.key;});
    var av = otras.length ? '<span class="prov">También se capacita en: '+
             esc2(otras.map(function(x){return x.servicio+" ("+dmy(x.fecha)+")";}).join(", "))+'</span>' : '';
    h+='<label><input type="checkbox" class="segchk" value="'+esc2(e.cod)+'" checked>'+
       '<span><span class="cod">['+esc2(e.cod)+']</span> '+esc2(e.nom)+
       '<span class="prov">'+esc2(e.prov)+'</span>'+av+'</span></label>';
  });
  h+='</div><input type="text" class="segnota" id="segNota" placeholder="Observación (opcional): asistentes, motivo de reprogramación, nueva fecha…">';
  body.innerHTML=h;
  foot.innerHTML='<span class="muted" style="font-size:11.5px;color:var(--tx2)">Planilla: '+esc2(j.planilla||"—")+'</span>'+
    '<button class="sbtn sb-si" onclick="segResp(\'si\')">✔ Sí, se realizó</button>'+
    '<button class="sbtn sb-no" onclick="segResp(\'no\')">✖ No se realizó</button>'+
    '<button class="sbtn sb-lat" onclick="segLuego()">⏰ Más tarde</button>'+
    '<button class="sbtn sb-gh" onclick="segVer(\'todas\')">Ver las 89</button>';
}

function segResp(r){
  var j=cola[iq]; if(!j) return;
  var ejec=[];
  if(r==="si"){ Array.prototype.forEach.call(body.querySelectorAll(".segchk"), function(c){ if(c.checked) ejec.push(c.value); }); }
  var nota=(document.getElementById("segNota")||{}).value||"";
  aplica(j, r, ejec, nota);
  cola.splice(iq,1); if(iq>=cola.length) iq=Math.max(0,cola.length-1);
  if(cola.length) pintaPregunta(); else { vista="todas"; pintaLista(); }
}
window.segResp=segResp;

function aplica(j, r, ejec, nota){
  S.resp[j.key]={r:r, ejec:(ejec||[]), nota:nota||"", ts:Date.now(), dia:hoy()};
  delete S.snooze[j.key];
  ssave(); recalcula(); pintaBadge();
}

// Recalcula el estado de cada tipologia a partir de TODAS sus jornadas:
//   · todas respondidas y en todas se capacito  -> ejecutada
//   · en alguna respondida NO se capacito       -> reprogramada
//   · quedan jornadas por realizar              -> pendiente (en CSSO)
// Las tipologias sin ninguna jornada respondida no se tocan.
function recalcula(){
  Object.keys(JXROW).forEach(function(id){
    var js=JXROW[id], cod=String(IDX[id].codigo).trim();
    var resp=js.filter(function(j){ return !!S.resp[j.key]; });
    if(!resp.length) return;
    var falla = resp.some(function(j){ return !hechoEn(j, cod); });
    var completo = (resp.length===js.length) && !falla;
    var o=ov(id);
    o.estado = falla ? "reprogramada" : (completo ? "ejecutada" : "pendiente");
    o.slots  = slotsDe(js);
    var det = js.map(function(j){
      var mk = S.resp[j.key] ? (hechoEn(j,cod) ? "\u2714" : "\u2716") : "\u00b7";
      return mk+" "+j.servicio+" "+dmy(j.fecha);
    }).join(" | ");
    var txt = NOTA_PFX + det;
    if(!o.notas || o.notas.indexOf(NOTA_PFX)===0) o.notas = txt;
  });
  save(); renderDash(); renderTable();
}

function segLuego(){
  var j=cola[iq]; if(!j) return;
  S.snooze[j.key]=hoy(); ssave();
  cola.splice(iq,1); if(iq>=cola.length) iq=Math.max(0,cola.length-1);
  if(cola.length) pintaPregunta(); else { vista="todas"; pintaLista(); }
}
window.segLuego=segLuego;

function segDeshacer(k){
  var j=SEG.jornadas.filter(function(x){return x.key===k;})[0]; if(!j) return;
  delete S.resp[k];
  filas(j).forEach(function(row){ var o=ov(row.id);
    var otras=(JXROW[row.id]||[]).filter(function(x){ return !!S.resp[x.key]; });
    if(!otras.length){ o.estado="pendiente"; if((o.notas||"").indexOf(NOTA_PFX)===0) o.notas=""; }
  });
  ssave(); recalcula(); pintaBadge(); pintaLista();
}
window.segDeshacer=segDeshacer;

function segMarcar(k){
  var i=-1; cola=SEG.jornadas.filter(function(x){return x.key===k;}); iq=0;
  if(!cola.length) return; vista="pend"; pintaPregunta();
}
window.segMarcar=segMarcar;
function segVer(v){ vista=v; if(v==="pend"){ cola=porPreguntar(); iq=0; } pinta(); }
window.segVer=segVer;

// Registro masivo: solo para ponerse al dia cuando se acumulan jornadas
// vencidas. Marca la jornada COMPLETA (todo su equipamiento) de una sola vez.
function segMasivo(r){
  var js=pendientes();
  if(!js.length) return;
  var q = r==="si" ? "¿Confirmar que las "+js.length+" jornadas vencidas SE REALIZARON, con todo su equipamiento?"
                   : "¿Marcar las "+js.length+" jornadas vencidas como NO REALIZADAS (reprogramar)?";
  if(!confirm(q+"\n\nSe puede deshacer una por una desde esta misma lista.")) return;
  js.forEach(function(j){
    S.resp[j.key]={r:r, ejec:(r==="si"?j.equipos.map(function(e){return e.cod;}):[]),
                   nota:"registro masivo", ts:Date.now(), dia:hoy()};
    delete S.snooze[j.key];
  });
  ssave(); recalcula(); pintaBadge(); pintaLista();
}
window.segMasivo=segMasivo;

var fJor="todas";
function setFJor(v){ fJor=v; pintaLista(); }
window.setFJor=setFJor;

function pintaLista(){
  tit.textContent="Jornadas propuestas a la CSSO";
  var pend=pendientes().length;
  var vt={}; SEG.jornadas.forEach(function(j){ j.equipos.forEach(function(e){ vt[e.cod]=1; }); });
  sub.textContent=SEG.jornadas.length+" jornadas · "+Object.keys(vt).length+" tipologías ("+
    SEG.jornadas.reduce(function(a,j){return a+j.equipos.length;},0)+" pares servicio-jornada) · "+
    dmy(SEG.jornadas[0].fecha)+" a "+dmy(SEG.jornadas[SEG.jornadas.length-1].fecha)+
    (pend?(" · "+pend+" por confirmar"):" · sin jornadas por confirmar");
  var LBL={si:["Sí","sp-si"],parcial:["Parcial","sp-si"],no:["No","sp-no"],
           esp:["Por confirmar","sp-esp"],fut:["Programada","sp-fut"]};
  var rows=SEG.jornadas.filter(function(j){
    var e=estadoJor(j);
    if(fJor==="pend") return e==="esp";
    if(fJor==="hechas") return e==="si"||e==="parcial";
    if(fJor==="no") return e==="no";
    if(fJor==="prox") return e==="fut";
    return true;
  });
  var cnt={si:0,parcial:0,no:0,esp:0,fut:0};
  SEG.jornadas.forEach(function(j){ cnt[estadoJor(j)]++; });
  var h='<div class="segtabs">'+
    [["todas","Todas ("+SEG.jornadas.length+")"],["pend","Por confirmar ("+cnt.esp+")"],
     ["hechas","Realizadas ("+(cnt.si+cnt.parcial)+")"],["no","No realizadas ("+cnt.no+")"],
     ["prox","Programadas ("+cnt.fut+")"]].map(function(t){
       return '<button class="'+(fJor===t[0]?"on":"")+'" onclick="setFJor(\''+t[0]+'\')">'+t[1]+'</button>';
     }).join("")+'</div>';
  h+='<table class="segtb"><colgroup><col class="c-n"><col class="c-f"><col class="c-h"><col class="c-sv"><col class="c-eq"><col class="c-e"><col class="c-a"></colgroup>'+
     '<thead><tr><th>#</th><th>Fecha</th><th>Hora</th><th>Servicio clínico</th>'+
     '<th>Equipamiento</th><th>Estado</th><th></th></tr></thead><tbody>';
  rows.forEach(function(j){
    var e=estadoJor(j), l=LBL[e];
    var eq=j.equipos.map(function(x){return "["+x.cod+"] "+x.nom;}).join("<br>");
    var acc = RO ? '' : (S.resp[j.key]
      ? '<button class="lnk" onclick="segDeshacer(\''+j.key+'\')">deshacer</button>'
      : '<button class="lnk" onclick="segMarcar(\''+j.key+'\')">registrar</button>');
    h+='<tr><td>'+j.n+'</td><td>'+dmy(j.fecha)+'</td><td>'+esc2(j.hora)+'</td><td>'+esc2(j.servicio)+'</td>'+
       '<td>'+eq+'</td><td><span class="segpill '+l[1]+'">'+l[0]+'</span></td><td>'+acc+'</td></tr>';
  });
  if(!rows.length) h+='<tr><td colspan="7" style="padding:22px;text-align:center;color:var(--tx2)">Sin jornadas en este filtro.</td></tr>';
  h+='</tbody></table>';
  body.innerHTML=h;
  foot.innerHTML='<span class="muted" style="font-size:11.5px;color:var(--tx2)">'+
    (RO ? 'Fechas propuestas a la CSSO. El registro de ejecución se lleva en la plataforma de coordinación.'
        : 'Las respuestas actualizan el estado de cada tipología y, con eso, el avance global.')+'</span>'+
    (!RO&&porPreguntar().length?'<button class="sbtn sb-si" onclick="segVer(\'pend\')">✔ Confirmar una por una ('+porPreguntar().length+')</button>':'')+
    (!RO&&pendientes().length>1?'<button class="sbtn sb-lat" onclick="segMasivo(\'si\')" title="Marca de una vez las '+pendientes().length+' jornadas vencidas como realizadas">✔✔ Todas realizadas</button>':'')+
    '<button class="sbtn sb-gh" onclick="segCerrar()">Cerrar</button>';
}

// ── 4. arranque: pop-up si hay jornadas vencidas sin respuesta ─────────────
if(!RO) pintaBadge();
if(!RO && QS.get("seg")!=="0" && porPreguntar().length){ segAbrir("pend"); }
})();
</script>
<script src="hub-home.js"></script>
</body>
</html>
