<style>
:root {
  --navy: #1D2D5B;
  --navy2: #1D2D5B;
  --navy3:  #182240;
  --teal:   #0d9488;
  --teal2:  #14b8a6;
  --white:  #ffffff;
  --text-muted: #94a3b8;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--navy); color:var(--white); min-height:100vh; }

/* ── HEADER ─────────────────── */
.app-header {
  background:#1D2D5B;
  border-bottom:1.5px solid rgba(20,184,166,0.25);
  padding:0 24px; position:sticky; top:0; z-index:100;
  box-shadow:0 2px 20px rgba(0,0,0,.5);
}
.header-inner {
  max-width:1400px; margin:0 auto;
  display:flex; align-items:center; gap:16px; height:68px;
}
.header-logo { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.header-logo img { height:52px; width:auto; border-radius:7px; }
.header-search { flex:1; max-width:520px; margin-left:auto; position:relative; }
.header-search input {
  width:100%; padding:10px 16px 10px 42px;
  border:1px solid rgba(20,184,166,.25); border-radius:10px;
  background:rgba(255,255,255,.07); color:#fff; font-size:14px;
  outline:none; transition:all .2s;
}
.header-search input::placeholder { color:rgba(255,255,255,.45); }
.header-search input:focus { background:rgba(20,184,166,.12); border-color:rgba(20,184,166,.5); }
.search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none; }
.header-stats { display:flex; gap:20px; margin-left:16px; flex-shrink:0; }
.hstat { text-align:center; }
.hstat-n { font-size:18px; font-weight:800; color:var(--teal2); line-height:1; }
.hstat-l { font-size:9px; color:var(--text-muted); letter-spacing:.07em; text-transform:uppercase; margin-top:2px; }

/* ── FILTER BAR ──────────────── */
.filter-bar {
  background:var(--navy2); border-bottom:1px solid rgba(255,255,255,.06);
  padding:0 24px; position:sticky; top:68px; z-index:99;
  display:flex; align-items:center; gap:8px; overflow-x:auto;
  scrollbar-width:none; height:46px;
}
.filter-bar::-webkit-scrollbar { display:none; }
.fbtn {
  padding:5px 14px; border-radius:20px; border:1.5px solid rgba(255,255,255,.12);
  background:transparent; color:rgba(255,255,255,.6); font-size:11.5px;
  font-weight:600; cursor:pointer; white-space:nowrap; transition:all .15s;
  letter-spacing:.03em; flex-shrink:0;
}
.fbtn:hover { background:rgba(20,184,166,.12); border-color:rgba(20,184,166,.4); color:#fff; }
.fbtn.active { background:rgba(20,184,166,.2); border-color:var(--teal2); color:var(--teal2); }

/* ── RESULTS BAR ─────────────── */
.results-bar {
  max-width:1400px; margin:0 auto; padding:10px 24px 4px;
  font-size:11.5px; color:var(--text-muted); letter-spacing:.04em;
}

/* ── GRID ─────────────────────── */
.grid-wrap {
  max-width:1400px; margin:0 auto; padding:12px 24px 60px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); gap:14px;
}

/* ── KIT CARD ─────────────────── */
.kcard {
  background:var(--navy3);
  border:1.5px solid rgba(255,255,255,.07);
  border-radius:13px; padding:0;
  cursor:pointer; transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  display:flex; flex-direction:column; overflow:hidden;
}
.kcard:hover {
  transform:translateY(-3px);
  border-color:rgba(20,184,166,.4);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.kcard-top {
  padding:14px 16px 12px;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex; flex-direction:column; gap:7px; flex:1;
}
.kcard-cat {
  display:inline-flex; align-items:center; gap:5px;
  font-size:9.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 9px; border-radius:12px;
  width:fit-content; border:1px solid transparent;
}
.kcard-name {
  font-size:13.5px; font-weight:700; color:var(--white);
  line-height:1.3; letter-spacing:-.01em;
}
.kcard-bottom {
  padding:9px 16px; display:flex; align-items:center; justify-content:space-between;
}
.kcard-meta { display:flex; gap:14px; }
.kmeta-item {
  display:flex; flex-direction:column; align-items:center; gap:1px;
}
.kmeta-n { font-size:15px; font-weight:800; color:var(--teal2); }
.kmeta-l { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; }
.kcard-arrow { color:var(--teal2); font-size:1.1rem; opacity:.65; }

/* ── MODAL ─────────────────────── */
.modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(5,10,25,.85); z-index:200;
  backdrop-filter:blur(6px); padding:20px;
  overflow-y:auto;
}
.modal-overlay.open { display:flex; align-items:flex-start; justify-content:center; }
.modal {
  background:#0f1e3a; border:1.5px solid rgba(20,184,166,.3);
  border-radius:16px; width:100%; max-width:680px;
  box-shadow:0 24px 60px rgba(0,0,0,.7); overflow:hidden;
  margin:auto;
}
.modal-header {
  background: #1D2D5B;
  padding:20px 22px 16px;
  border-bottom:1px solid rgba(20,184,166,.2);
  position:relative;
}
.modal-close {
  position:absolute; top:16px; right:18px;
  background:rgba(255,255,255,.08); border:none;
  color:rgba(255,255,255,.6); width:30px; height:30px;
  border-radius:50%; font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
.modal-close:hover { background:rgba(255,255,255,.15); color:#fff; }
.modal-cat-badge {
  font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  padding:3px 10px; border-radius:12px; display:inline-block; margin-bottom:8px;
  border:1px solid transparent;
}
.modal-title { font-size:1.35rem; font-weight:800; color:#fff; letter-spacing:-.02em; line-height:1.2; }
.modal-stats {
  display:flex; gap:20px; margin-top:12px;
}
.mstat {
  background:rgba(20,184,166,.1); border:1px solid rgba(20,184,166,.2);
  border-radius:8px; padding:8px 14px; text-align:center;
}
.mstat-n { font-size:1.3rem; font-weight:800; color:var(--teal2); }
.mstat-l { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.07em; margin-top:1px; }
.modal-body { padding:18px 22px; max-height:60vh; overflow-y:auto; }
.modal-body::-webkit-scrollbar { width:4px; }
.modal-body::-webkit-scrollbar-thumb { background:rgba(20,184,166,.3); border-radius:4px; }

/* Items table */
.items-table { width:100%; border-collapse:collapse; }
.items-table th {
  font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-muted); padding:8px 10px; text-align:left;
  border-bottom:1px solid rgba(255,255,255,.08); position:sticky; top:0;
  background:#0f1e3a;
}
.items-table td {
  padding:8px 10px; font-size:12.5px; color:rgba(255,255,255,.85);
  border-bottom:1px solid rgba(255,255,255,.04);
  vertical-align:middle;
}
.items-table tr:hover td { background:rgba(20,184,166,.05); }
.item-id { font-family:monospace; font-size:11px; color:var(--text-muted); }
.item-qty {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:28px; height:22px; border-radius:6px; padding:0 7px;
  background:rgba(20,184,166,.15); color:var(--teal2);
  font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;
}

/* ── NO RESULTS ──────────────── */
.no-results {
  text-align:center; padding:60px 20px; color:var(--text-muted);
  grid-column:1/-1;
}
.no-results p { margin-top:12px; font-size:14px; }

/* ── FOOTER ──────────────────── */
footer {
  background:var(--navy2); border-top:1px solid rgba(255,255,255,.06);
  padding:14px 24px; display:flex; align-items:center; justify-content:space-between;
}
.footer-left { display:flex; align-items:center; gap:10px; }
.footer-logo { height:22px; opacity:.6; }
.footer-txt { font-size:11px; color:var(--text-muted); }
.footer-right { font-size:10px; color:rgba(148,163,184,.5); letter-spacing:.06em; text-transform:uppercase; }

@media(max-width:700px){
  .header-stats { display:none; }
  .grid-wrap { grid-template-columns:1fr; padding:10px 12px 40px; }
  .modal { max-width:100%; }
}

/* ══ WHITE THEME OVERRIDE ══════════════════════════════════ */
:root {
  --page-bg: #f8fafc;
  --card-bg: #ffffff;
  --card-border: #e2e8f0;
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-muted-lt: #94a3b8;
  --inst-blue: #1D2D5B;
  --inst-blue2: #1D2D5B;
  --inst-accent: #29aae2;
}
body {
  background: var(--page-bg) !important;
  color: var(--text-primary) !important;
}

/* Header stays institutional blue */
.app-header { background: #1D2D5B !important; border-bottom-color: rgba(41,170,226,0.3) !important; box-shadow: 0 2px 16px rgba(0,0,0,.18) !important; }
.filter-bar  { background: #1D2D5B !important; border-bottom-color: rgba(41,170,226,0.15) !important; }
/* Cards */
.kcard { background: var(--card-bg) !important; border-color: var(--card-border) !important; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.kcard:hover { border-color: var(--inst-accent) !important; box-shadow: 0 6px 24px rgba(26,39,68,.12) !important; }
.kcard-name { color: var(--text-primary) !important; }
.kcard-bottom { background: #f8fafc; border-top: 1px solid var(--card-border); }
.kmeta-l, .results-bar { color: var(--text-secondary) !important; }
.kmeta-n, .kcard-arrow { color: var(--inst-accent) !important; }
.hstat-n { color: var(--inst-accent) !important; }
.hstat-l { color: rgba(255,255,255,.7) !important; }
/* Filter buttons */
.fbtn { border-color: rgba(255,255,255,.25) !important; color: rgba(255,255,255,.8) !important; }
.fbtn:hover { background: rgba(41,170,226,.18) !important; border-color: var(--inst-accent) !important; color:#fff !important; }
.fbtn.active { background: rgba(41,170,226,.25) !important; border-color: var(--inst-accent) !important; color:#fff !important; }
/* Search input */
.header-search input { background: rgba(255,255,255,.12) !important; border-color: rgba(255,255,255,.2) !important; color:#fff !important; }
.header-search input::placeholder { color: rgba(255,255,255,.5) !important; }
/* Modal */
.modal { background: #ffffff !important; border-color: rgba(41,170,226,.3) !important; }
.modal-header { background: #1D2D5B !important; }
.modal-body { background:#fff !important; }
.item-row { border-bottom-color: #e2e8f0 !important; }
.item-row:hover { background: #f0f7ff !important; }
.item-id { color: var(--text-muted-lt) !important; }
.item-name { color: var(--text-primary) !important; }
.item-qty { color: var(--inst-blue) !important; background: #e8f0fe !important; border-color: #c7d7f8 !important; }

/* Items table — white modal fix */
.items-table th {
  background: #1D2D5B !important;
  color: #ffffff !important;
  border-bottom-color: rgba(41,170,226,0.2) !important;
}
.items-table td {
  color: var(--text-primary, #1e293b) !important;
  border-bottom-color: #e2e8f0 !important;
}
.items-table tr:hover td {
  background: #f0f7ff !important;
}
.item-id { color: #64748b !important; }
.modal-close { background: rgba(0,0,0,.12) !important; color: #fff !important; }





/* ── HUB back full logo ── */
.hub-back {
  display:flex; align-items:center; justify-content:center;
  text-decoration:none; margin-right:18px; flex-shrink:0;
  opacity:0.9; transition:opacity .2s, transform .15s;
  border-right:1px solid rgba(255,255,255,0.18); padding-right:18px;
}
.hub-back:hover { opacity:1; transform:scale(1.03); }


/* ── PRICE FEATURES ─────────────────────── */
.price-col { display:none; }
.modal.show-prices .price-col { display:table-cell; }
.price-val { font-variant-numeric:tabular-nums; font-size:12px; color:#1e293b; }
.price-total-row td { font-weight:700; background:rgba(41,170,226,.07) !important; border-top:2px solid rgba(41,170,226,.3) !important; }
.price-total-row .price-val { color:#1D2D5B !important; font-size:13px; font-weight:800; }
.no-price { color:#94a3b8; font-style:italic; font-size:11px; }
.btn-eye {
  display:inline-flex; align-items:center; gap:5px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.75); border-radius:8px; padding:5px 11px;
  font-size:11px; font-weight:600; cursor:pointer; transition:all .15s;
}
.btn-eye:hover, .btn-eye.active { background:rgba(41,170,226,.25); border-color:#29aae2; color:#fff; }
.modal-header-actions { margin-top:10px; display:flex; align-items:center; gap:10px; }
.kit-total-badge {
  font-size:12px; font-weight:700; color:#fbbf24;
  background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.25);
  border-radius:6px; padding:4px 10px; white-space:nowrap;
  display:none;
}
.kit-total-badge.visible { display:inline-block; }

/* ── ROPA ESTÉRIL FLOAT BUTTON ──────────── */
.ropa-float-btn {
  position:fixed; bottom:24px; right:24px; z-index:300;
  display:flex; align-items:center; gap:9px;
  background:#fff; border:1.5px solid rgba(245,158,11,.7);
  color:#92400e; padding:11px 18px; border-radius:14px;
  font-size:12.5px; font-weight:700; cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.14);
  transition:all .18s; letter-spacing:.02em;
}
.ropa-float-btn:hover { background:#fffbeb; border-color:#f59e0b; transform:translateY(-2px); box-shadow:0 8px 28px rgba(0,0,0,.18); }

/* ── ROPA ESTÉRIL OVERLAY ───────────────── */
.ropa-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(5,10,25,.82); z-index:400;
  backdrop-filter:blur(7px); padding:20px; overflow-y:auto;
}
.ropa-overlay.open { display:flex; align-items:flex-start; justify-content:center; }
.ropa-modal {
  background:#fff; border:1.5px solid rgba(245,158,11,.35);
  border-radius:16px; width:100%; max-width:760px; margin:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.5); overflow:hidden;
}
.ropa-modal-hdr {
  background:#1D2D5B; padding:18px 22px 14px;
  border-bottom:1px solid rgba(245,158,11,.25);
  display:flex; align-items:center; justify-content:space-between;
}
.ropa-badge-label { font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:3px 10px; border-radius:12px; background:rgba(245,158,11,.18); color:#fbbf24; border:1px solid rgba(245,158,11,.4); margin-bottom:5px; display:inline-block; }
.ropa-modal-hdr h2 { font-size:1.15rem; font-weight:800; color:#fff; }
.ropa-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; padding:18px 22px 24px; background:#f8fafc; }
.ropa-card { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:14px 16px; transition:all .15s; }
.ropa-card:hover { border-color:rgba(245,158,11,.5); box-shadow:0 4px 16px rgba(0,0,0,.08); }
.ropa-card-name { font-size:13px; font-weight:700; color:#1e293b; margin-bottom:6px; }
.ropa-card-meta { display:flex; gap:14px; font-size:11px; color:#64748b; margin-bottom:8px; }
.ropa-meta-val { font-weight:700; color:#1D2D5B; }
.ropa-eye-btn { display:inline-flex; align-items:center; gap:5px; background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.35); color:#92400e; border-radius:7px; padding:4px 10px; font-size:11px; font-weight:600; cursor:pointer; transition:all .15s; }
.ropa-eye-btn:hover, .ropa-eye-btn.active { background:rgba(245,158,11,.2); border-color:#f59e0b; }
.ropa-items-panel { display:none; margin-top:10px; border-top:1px solid #e2e8f0; padding-top:10px; }
.ropa-items-panel.open { display:block; }
.ropa-item-row { display:flex; justify-content:space-between; align-items:center; padding:4px 2px; border-bottom:1px solid #f1f5f9; font-size:11.5px; gap:8px; }
.ropa-item-name { color:#374151; flex:1; }
.ropa-item-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.ropa-item-qty { background:#fef3c7; color:#92400e; border-radius:5px; padding:1px 7px; font-size:11px; font-weight:700; border:1px solid #fde68a; }
.ropa-item-price { color:#64748b; font-size:11px; font-variant-numeric:tabular-nums; }
.ropa-kit-total { margin-top:8px; text-align:right; font-size:12px; font-weight:700; color:#1D2D5B; }
.ropa-kit-total span { color:#d97706; }


/* ── ROPA ESTÉRIL: distinguir visualmente como cards verde hospital ── */
.kcard.is-ropa{
  background: linear-gradient(140deg, rgba(16,185,129,.10), rgba(5,150,105,.06)) !important;
  border-color: #10b981 !important;
  border-width: 1.5px !important;
}
.kcard.is-ropa:hover{
  border-color: #059669 !important;
  box-shadow: 0 8px 24px rgba(16,185,129,.18) !important;
}
.kcard.is-ropa .kcard-cat{
  background: #10b981 !important;
  color: #fff !important;
  font-weight: 700 !important;
}
/* Chip 'Ropa Estéril' en la barra de filtros */
.fbtn[data-cat="Ropa Estéril"]{
  background: rgba(16,185,129,.14) !important;
  border-color: #10b981 !important;
  color: #6ee7b7 !important;
  font-weight: 700 !important;
}
.fbtn[data-cat="Ropa Estéril"].active{
  background: #10b981 !important;
  color: #fff !important;
}

</style>
</head>
<body>

<!-- ROPA ESTÉRIL FLOAT BUTTON -->
<button class="ropa-float-btn" onclick="openRopa()">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 8l9-5 9 5"/><path d="M9 8v13"/><path d="M15 8v13"/></svg>
  Ropa Estéril
</button>

<!-- ROPA ESTÉRIL OVERLAY -->
<div class="ropa-overlay" id="ropaOverlay" onclick="if(event.target===this){closeRopa()}">
  <div class="ropa-modal">
    <div class="ropa-modal-hdr">
      <div>
        <span class="ropa-badge-label">Pabellón · HDS</span>
        <h2>Paquetes de Ropa Estéril</h2>
      </div>
      <button class="modal-close" onclick="closeRopa()">✕</button>
    </div>
    <div class="ropa-grid" id="ropaGrid"></div>
  </div>
</div>


<!-- HEADER -->

function catStyle(cat) {
  return CAT_COLORS[cat] || ['#94a3b8','rgba(148,163,184,.12)'];
}

// ── STATE ─────────────────────────────────────────────────────
let activeCat = 'all';
let searchQ   = '';

// ── RENDER FILTER BAR ─────────────────────────────────────────
function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  const allCats = [...new Set(KITS.map(k=>k.categoria))];
  // Orden: Ropa Estéril primero, luego el resto alfabético
  const cats = [
    ...(allCats.includes('Ropa Estéril') ? ['Ropa Estéril'] : []),
    ...allCats.filter(c => c !== 'Ropa Estéril').sort()
  ];
  bar.innerHTML = '<button class="fbtn active" data-cat="all">Todos</button>';
  cats.forEach(cat => {
    const [color] = catStyle(cat);
    const btn = document.createElement('button');
    btn.className = 'fbtn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.style.setProperty('--cat-color', color);
    bar.appendChild(btn);
  });
  bar.addEventListener('click', e => {
    const btn = e.target.closest('.fbtn');
    if (!btn) return;
    bar.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    render();
  });
}

// ── RENDER GRID ───────────────────────────────────────────────
function render() {
  const wrap = document.getElementById('gridWrap');
  const noRes = document.getElementById('noResults');
  const info  = document.getElementById('resultsInfo');
  const q = searchQ.toLowerCase().trim();

  const filtered = KITS.filter(k => {
    // 'Ropa Estéril' ahora se muestra como una pestaña más
    const catOk = activeCat === 'all' || k.categoria === activeCat;
    if (!catOk) return false;
    if (!q) return true;
    if (k.nombre.toLowerCase().includes(q)) return true;
    return k.items.some(i =>
      i.nombre.toLowerCase().includes(q) || i.id.includes(q)
    );
  });

  document.getElementById('statKits').textContent = filtered.length;
  info.textContent = filtered.length === KITS.length
    ? `Mostrando los ${KITS.length} kits quirúrgicos`
    : `${filtered.length} kit${filtered.length!==1?'s':''} encontrado${filtered.length!==1?'s':''}`;

  if (filtered.length === 0) {
    wrap.style.display = 'none';
    noRes.style.display = '';
    return;
  }
  wrap.style.display = '';
  noRes.style.display = 'none';

  wrap.innerHTML = filtered.map(k => {
    const [color, bg] = catStyle(k.categoria);
    return `
    <div class="kcard ${k.categoria === 'Ropa Estéril' ? 'is-ropa' : ''}" onclick="openModal('${k.id}')">
      <div class="kcard-top">
        <span class="kcard-cat" style="color:${color};background:${bg};border-color:${color}44">
          ${k.categoria}
        </span>
        <div class="kcard-name">${k.nombre}</div>
      </div>
      <div class="kcard-bottom">
        <div class="kcard-meta">
          <div class="kmeta-item">
            <span class="kmeta-n">${k.total_items}</span>
            <span class="kmeta-l">Artículos</span>
          </div>
          <div class="kmeta-item">
            <span class="kmeta-n">${k.total_unidades}</span>
            <span class="kmeta-l">Unidades</span>
          </div>
        </div>
        <span class="kcard-arrow">→</span>
      </div>
    </div>`;
  }).join('');
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(kitId) {
  const kit = KITS.find(k => k.id === kitId);
  if (!kit) return;
  const [color, bg] = catStyle(kit.categoria);
  document.getElementById('mCatBadge').textContent  = kit.categoria;
  document.getElementById('mCatBadge').style.cssText =
    `color:${color};background:${bg};border-color:${color}55`;
  document.getElementById('mTitle').textContent  = kit.nombre;
  document.getElementById('mStats').innerHTML = `
    <div class="mstat"><div class="mstat-n">${kit.total_items}</div><div class="mstat-l">Artículos</div></div>
    <div class="mstat"><div class="mstat-n">${kit.total_unidades}</div><div class="mstat-l">Unidades totales</div></div>
  `;
  // Reset prices toggle
  const modal = document.querySelector('.modal');
  modal.classList.remove('show-prices');
  const eyeBtn = document.getElementById('eyeBtn');
  if(eyeBtn){ eyeBtn.classList.remove('active'); eyeBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Ver precios c/IVA'; }
  const kitTotalBadge = document.getElementById('kitTotalBadge');
  if(kitTotalBadge){ kitTotalBadge.classList.remove('visible'); kitTotalBadge.textContent=''; }

  const fmtCLP = n => n>0 ? '$'+Math.round(n).toLocaleString('es-CL') : '<span class="no-price">sin precio</span>';
  let kitTotal = 0; let allPriced = true;
  const rows = kit.items.map((it,i) => {
    const pu = PRICES[it.id] || 0;
    const sub = pu * it.cantidad;
    if(pu > 0) kitTotal += sub; else allPriced = false;
    return `<tr>
      <td><span class="item-id">${it.id}</span></td>
      <td>${it.nombre}</td>
      <td style="text-align:center"><span class="item-qty">${it.cantidad}</span></td>
      <td class="price-col" style="text-align:right"><span class="price-val">${fmtCLP(pu)}</span></td>
      <td class="price-col" style="text-align:right"><span class="price-val">${pu>0?fmtCLP(sub):'—'}</span></td>
    </tr>`;
  });
  const totalNote = allPriced ? '' : ' <span style="font-size:10px;color:#94a3b8">(parcial)</span>';
  // Populate badge next to eye button
  if(kitTotalBadge && kitTotal > 0){
    kitTotalBadge.textContent = '$'+Math.round(kitTotal).toLocaleString('es-CL') + (allPriced ? '' : '*');
    kitTotalBadge.title = allPriced ? 'Total kit c/IVA' : 'Total parcial — algunos ítems sin precio';
  }
  rows.push(`<tr class="price-total-row">
    <td colspan="3" style="text-align:right;font-size:11px;color:#64748b;font-weight:600">TOTAL KIT</td>
    <td class="price-col"></td>
    <td class="price-col" style="text-align:right"><span class="price-val">${fmtCLP(kitTotal)}${totalNote}</span></td>
  </tr>`);
  document.getElementById('mItems').innerHTML = rows.join('');
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function togglePrices(btn) {
  const modal = document.querySelector('.modal');
  const show = modal.classList.toggle('show-prices');
  btn.classList.toggle('active', show);
  btn.innerHTML = show
    ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Ocultar precios'
    : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Ver precios c/IVA';
  const badge = document.getElementById('kitTotalBadge');
  if(badge && badge.textContent) badge.classList.toggle('visible', show);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow=''; }
});

// ── ROPA ESTÉRIL ─────────────────────────────────────────────
function openRopa() {
  const ropaKits = KITS.filter(k => k.categoria === 'Ropa Estéril');
  const fmtCLP = n => n>0 ? '$'+Math.round(n).toLocaleString('es-CL') : '<span style="color:#94a3b8;font-style:italic;font-size:10px">sin precio</span>';
  document.getElementById('ropaGrid').innerHTML = ropaKits.map((kit,ki) => {
    const totalItems = kit.total_items || kit.items.length;
    const totalUds = kit.total_unidades || kit.items.reduce((s,i)=>s+i.cantidad,0);
    let kitTotal = 0; let allPriced = true;
    const itemsHTML = kit.items.map(it => {
      const pu = PRICES[it.id]||0; const sub = pu*it.cantidad;
      if(pu>0) kitTotal+=sub; else allPriced=false;
      return `<div class="ropa-item-row">
        <span class="ropa-item-name">${it.nombre}</span>
        <div class="ropa-item-right">
          <span class="ropa-item-qty">${it.cantidad}</span>
          <span class="ropa-item-price">${fmtCLP(pu)}</span>
        </div>
      </div>`;
    }).join('');
    const totalNote = allPriced?'':'<span style="font-size:10px;color:#94a3b8"> (parcial)</span>';
    return `<div class="ropa-card">
      <div class="ropa-card-name">${kit.nombre}</div>
      <div class="ropa-card-meta">
        <span><span class="ropa-meta-val">${totalItems}</span> artículos</span>
        <span><span class="ropa-meta-val">${totalUds}</span> uds.</span>
      </div>
      <button class="ropa-eye-btn" onclick="toggleRopaCard(this)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Ver insumos y precios
      </button>
      <div class="ropa-items-panel">
        ${itemsHTML}
        <div class="ropa-kit-total">Total kit: <span>${fmtCLP(kitTotal)}${totalNote}</span></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('ropaOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeRopa() {
  document.getElementById('ropaOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function toggleRopaCard(btn) {
  const panel = btn.nextElementSibling;
  const open = panel.classList.toggle('open');
  btn.classList.toggle('active', open);
  btn.innerHTML = open
    ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Ocultar'
    : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Ver insumos y precios';
}
